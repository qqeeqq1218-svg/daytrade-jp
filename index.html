<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071426;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic",
                   Meiryo, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 24px 18px 60px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9db0c9;
      font-size: 16px;
      margin-bottom: 22px;
    }

    .status-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .badge {
      padding: 10px 16px;
      border-radius: 30px;
      border: 1px solid #25527a;
      background: #10253d;
      font-size: 15px;
    }

    .ok {
      color: #65ff9c;
    }

    .error {
      color: #ff7b84;
    }

    .loading {
      color: #ffd76a;
    }

    .message {
      background: #101f31;
      border: 1px solid #29445f;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 22px;
      color: #b8c5d8;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .tab {
      border: none;
      border-radius: 16px;
      padding: 20px 10px;
      color: white;
      background: #132946;
      font-weight: bold;
      font-size: 20px;
      cursor: pointer;
    }

    .tab.active {
      background: linear-gradient(
        135deg,
        #1689ff,
        #12b9f6
      );
    }

    h2 {
      font-size: 27px;
      margin-top: 10px;
    }

    .ranking {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: #101f31;
      border: 1px solid #29445f;
      border-radius: 17px;
      padding: 17px;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .rank {
      min-width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #173655;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 21px;
      font-weight: bold;
    }

    .rank.gold {
      background: #e3b300;
      color: #151515;
    }

    .rank.silver {
      background: #c5ccd5;
      color: #151515;
    }

    .rank.bronze {
      background: #bc7740;
    }

    .stock-info {
      flex: 1;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
    }

    .code {
      color: #94a8bf;
      font-size: 14px;
      margin-top: 3px;
    }

    .score {
      font-weight: bold;
      font-size: 20px;
      color: #52e2ff;
    }

    .details {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      text-align: center;
    }

    .detail {
      background: #0a1727;
      padding: 9px 5px;
      border-radius: 9px;
    }

    .label {
      color: #869ab4;
      font-size: 12px;
    }

    .value {
      margin-top: 4px;
      font-size: 15px;
    }

    .positive {
      color: #ff7078;
    }

    .negative {
      color: #61a9ff;
    }

    .reason {
      margin-top: 13px;
      background: #0a1727;
      border-radius: 9px;
      padding: 12px;
      color: #c4d1df;
      line-height: 1.55;
    }

    .error-box {
      padding: 20px;
      background: #471c23;
      border: 1px solid #a83c48;
      color: #ff9ca3;
      border-radius: 15px;
      line-height: 1.7;
    }

    .notice {
      margin-top: 30px;
      color: #7e90a7;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 25px;
      }

      .tab {
        font-size: 18px;
      }

      .details {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .score {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📈 日本株 AIランキング</h1>

  <div class="subtitle">
    デイトレ候補・長期成長株候補を自動ランキング
  </div>

  <div class="status-area">

    <div id="status" class="badge loading">
      🟡 データ取得中
    </div>

    <div id="updated" class="badge">
      更新時刻：--
    </div>

    <div id="countdown" class="badge">
      次回更新：60秒
    </div>

  </div>


  <div id="message" class="message">
    ランキングデータを読み込んでいます。
  </div>


  <div class="tabs">

    <button
      id="dayButton"
      class="tab active"
      onclick="showDaytrade()"
    >
      ⚡ デイトレ<br>TOP30
    </button>

    <button
      id="longButton"
      class="tab"
      onclick="showLongterm()"
    >
      🚀 長期保有<br>TOP30
    </button>

  </div>


  <h2 id="rankingTitle">
    ⚡ デイトレ候補ランキング
  </h2>

  <div id="ranking" class="ranking"></div>


  <div class="notice">
    ※ランキングは参考情報です。利益を保証するものではありません。
  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbwO7wWUeLTTy6QXq1lR5odHNSpUGpEwgvxG4eFq9baS9P5vUOo5FN6Tfvx1sUQZVHizNg/exec";


let stockData = null;

let currentMode = "daytrade";

let seconds = 60;

let jsonpScript = null;

let timeoutTimer = null;


/*
=====================================
 Apps Scriptから呼ばれる関数
=====================================
*/

window.receiveData = function(data) {

  clearTimeout(timeoutTimer);

  console.log("取得データ", data);

  if (!data) {

    showError(
      "データが空です。"
    );

    return;
  }


  if (data.status !== "ok") {

    showError(
      data.message ||
      "APIからエラーが返されました。"
    );

    return;
  }


  stockData = data;


  document.getElementById("status").innerHTML =
    "🟢 データ取得成功";

  document.getElementById("status").className =
    "badge ok";


  document.getElementById("updated").innerHTML =
    "更新時刻：" + (data.updated || "--");


  document.getElementById("message").innerHTML =
    "ランキングデータを正常に取得しました。";


  seconds = 60;


  renderRanking();

};


/*
=====================================
 JSONPでデータ取得
=====================================
*/

function loadData() {

  document.getElementById("status").innerHTML =
    "🟡 データ取得中";

  document.getElementById("status").className =
    "badge loading";


  if (jsonpScript) {

    jsonpScript.remove();

  }


  jsonpScript =
    document.createElement("script");


  const separator =
    API_URL.includes("?")
      ? "&"
      : "?";


  jsonpScript.src =
    API_URL +
    separator +
    "callback=receiveData" +
    "&t=" +
    Date.now();


  jsonpScript.async = true;


  jsonpScript.onerror = function() {

    clearTimeout(timeoutTimer);

    showError(
      "Apps Scriptとの通信に失敗しました。"
    );

  };


  document.body.appendChild(jsonpScript);


  /*
   15秒たっても返事がない場合
  */

  timeoutTimer =
    setTimeout(function() {

      showError(
        "データ取得がタイムアウトしました。"
      );

    },15000);

}


/*
=====================================
 エラー表示
=====================================
*/

function showError(message) {

  document.getElementById("status").innerHTML =
    "🔴 データ取得失敗";

  document.getElementById("status").className =
    "badge error";


  document.getElementById("updated").innerHTML =
    "更新時刻：--";


  document.getElementById("message").innerHTML =
    `
    <div class="error-box">
      データを取得できませんでした。<br><br>
      ${message}
    </div>
    `;

}


/*
=====================================
 デイトレ表示
=====================================
*/

function showDaytrade() {

  currentMode = "daytrade";


  document
    .getElementById("dayButton")
    .classList.add("active");


  document
    .getElementById("longButton")
    .classList.remove("active");


  document.getElementById("rankingTitle").innerHTML =
    "⚡ デイトレ候補ランキング";


  renderRanking();

}


/*
=====================================
 長期保有表示
=====================================
*/

function showLongterm() {

  currentMode = "longterm";


  document
    .getElementById("longButton")
    .classList.add("active");


  document
    .getElementById("dayButton")
    .classList.remove("active");


  document.getElementById("rankingTitle").innerHTML =
    "🚀 長期成長株候補ランキング";


  renderRanking();

}


/*
=====================================
 ランキング生成
=====================================
*/

function renderRanking() {

  const container =
    document.getElementById("ranking");


  container.innerHTML = "";


  if (!stockData) {

    container.innerHTML =
      "<div class='message'>データ取得待ちです。</div>";

    return;

  }


  let list =
    stockData[currentMode];


  if (!Array.isArray(list)) {

    container.innerHTML =
      "<div class='error-box'>ランキングデータがありません。</div>";

    return;

  }


  list
    .slice(0,30)
    .forEach(function(stock,index) {


      const rank =
        stock.rank ||
        index + 1;


      let rankClass = "";

      if (rank === 1)
        rankClass = "gold";

      else if (rank === 2)
        rankClass = "silver";

      else if (rank === 3)
        rankClass = "bronze";


      let changeClass =
        Number(stock.change) >= 0
          ? "positive"
          : "negative";


      let changeText =
        Number(stock.change) >= 0
          ? "+"
          : "";


      const card =
        document.createElement("div");


      card.className = "card";


      card.innerHTML = `

        <div class="card-top">

          <div class="rank ${rankClass}">
            ${rank}
          </div>


          <div class="stock-info">

            <div class="name">
              ${escapeHtml(stock.name || "名称なし")}
            </div>

            <div class="code">
              ${escapeHtml(stock.code || stock.symbol || "")}
            </div>

          </div>


          <div class="score">
            ${number(stock.score)}
            点
          </div>

        </div>


        <div class="details">

          <div class="detail">

            <div class="label">
              株価
            </div>

            <div class="value">
              ¥${formatPrice(stock.price)}
            </div>

          </div>


          <div class="detail">

            <div class="label">
              騰落率
            </div>

            <div class="value ${changeClass}">
              ${changeText}${number(stock.change)}%
            </div>

          </div>


          <div class="detail">

            <div class="label">
              モメンタム
            </div>

            <div class="value">
              ${number(stock.momentum)}
            </div>

          </div>

        </div>


        <div class="reason">

          <strong>AI判定理由</strong><br>

          ${escapeHtml(
            stock.reason ||
            "分析中"
          )}

        </div>

      `;


      container.appendChild(card);

    });

}


/*
=====================================
 数字処理
=====================================
*/

function number(value) {

  const n = Number(value);

  if (Number.isNaN(n))
    return "-";

  return Math.round(n * 100) / 100;

}


function formatPrice(value) {

  const n = Number(value);

  if (Number.isNaN(n))
    return "-";

  return n.toLocaleString("ja-JP");

}


/*
=====================================
 HTML安全化
=====================================
*/

function escapeHtml(value) {

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/*
=====================================
 60秒カウントダウン
=====================================
*/

setInterval(function() {

  seconds--;


  if (seconds <= 0) {

    seconds = 60;

    loadData();

  }


  document.getElementById("countdown").innerHTML =
    "次回更新：" +
    seconds +
    "秒";


},1000);


/*
=====================================
 初回取得
=====================================
*/

loadData();

</script>

</body>
</html>
