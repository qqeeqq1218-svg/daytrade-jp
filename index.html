.card{

.top{

.stock{

.name{

.code{

}

.price{

}

.priceMain{
  font-size:18px;
  font-weight:bold;
}

.plus{
  color:#63e18a;
}

.minus{
  color:#ff7474;
}

.scoreRow{

  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  color:#9ba8bc;
}

.score{
  color:#68a9ff;
  font-weight:bold;
}

.reason{
  margin-top:10px;
  padding:10px 12px;
  border-radius:9px;
  background:#0a1423;
  color:#c6cfdd;
  line-height:1.6;
  font-size:14px;
}

.loading,
.empty{
  text-align:center;
  padding:70px 20px;
  color:#9eabc2;
  font-size:17px;
}

.errorBox{
  text-align:center;
  margin:35px 15px;
  padding:25px 15px;
  border-radius:14px;
  background:#28131a;
  border:1px solid #66323b;
  color:#ff8181;
  line-height:1.7;
}

.refreshBtn{
  margin-top:15px;
  border:none;
  background:#2f80ed;
  color:#fff;
  padding:12px 22px;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
}

footer{

  padding:25px 10px 40px;
  color:#6f7c91;
  font-size:12px;
}
