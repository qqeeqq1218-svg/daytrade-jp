<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>デイトレ・長期成長株ランキング</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#07111f;
  color:#fff;
}

header{
  background:linear-gradient(135deg,#0b1d35,#123c6b);
  padding:25px 15px;
  text-align:center;
  border-bottom:1px solid #244e75;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  color:#a9bed4;
  margin:10px 0 0;
  font-size:14px;
}

.status{
  margin-top:13px;
  font-size:13px;
  color:#68e39b;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.notice{
  background:#101f31;
  border:1px solid #27445f;
  border-radius:12px;
  padding:14px;
  margin-bottom:18px;
  color:#c8d6e5;
  font-size:13px;
  line-height:1.7;
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  border:none;
  border-radius:10px;
  padding:14px 8px;
  font-weight:bold;
  cursor:pointer;
  background:#172a40;
  color:#aebed0;
  font-size:15px;
}

.tab.active{
  background:#1677ff;
  color:white;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:12px 0;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.update{
  font-size:12px;
  color:#91a6ba;
}

.card{
  background:#0e1b2b;
  border:1px solid #1d3854;
  border-radius:12px;
  margin-bottom:10px;
  padding:13px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#3388dd;
}

.top1{
  border:2px solid #ffd54a;
}

.top2{
  border:2px solid #b7c5d4;
}

.top3{
  border:2px solid #c88444;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.rank{
  font-weight:900;
  font-size:21px;
  min-width:42px;
}

.info{
  flex:1;
}

.name{
  font-size:17px;
  font-weight:bold;
}

.code{
  color:#8299ad;
  font-size:12px;
  margin-top:2px;
}

.score{
  text-align:right;
  font-size:13px;
}

.score strong{
  display:block;
  font-size:18px;
  color:#5bd98b;
}

.reason{
  margin-top:9px;
  border-top:1px solid #21374c;
  padding-top:8px;
  color:#bbcad8;
  font-size:13px;
  line-height:1.6;
}

.tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:8px;
}

.tag{
  background:#143457;
  color:#7fc1ff;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.price{
  margin-top:7px;
  font-size:13px;
  color:#d4e2ef;
}

.up{
  color:#58df8b;
  font-weight:bold;
}

.down{
  color:#ff7070;
}

.refresh{
  position:fixed;
  bottom:20px;
  right:18px;
  border:none;
  border-radius:50px;
  background:#1677ff;
  color:white;
  padding:13px 18px;
  font-weight:bold;
  box-shadow:0 4px 15px #0008;
  cursor:pointer;
}

footer{
  text-align:center;
  color:#607b94;
  font-size:11px;
  padding:25px 10px 90px;
}

@media(max-width:600px){

  header h1{
    font-size:22px;
  }

  .name{
    font-size:15px;
  }

  .rank{
    font-size:18px;
    min-width:35px;
  }

  .score strong{
    font-size:16px;
  }

}
</style>
</head>

<body>

<header>

<h1>📈 日本株 AIランキング</h1>

<p>
デイトレ候補 ＆ 長期成長株候補
</p>

<div class="status">
● 自動更新 ON　
<span id="countdown">60</span>秒後に更新
</div>

</header>


<div class="container">

<div class="notice">
⚠ このランキングは株価・値動き・出来高・成長性などを参考に候補を順位化するための画面です。
「必ず勝てる銘柄」を保証するものではありません。
最終的な売買判断はご自身で行ってください。
</div>


<div class="tabs">

<button
class="tab active"
onclick="showTab('daytrade',this)">
🔥 デイトレ TOP30
</button>

<button
class="tab"
onclick="showTab('longterm',this)">
🚀 長期成長 TOP30
</button>

</div>


<section
id="daytrade"
class="section active">

<div class="section-title">

<h2>🔥 デイトレ候補 TOP30</h2>

<div class="update">
更新：
<span id="dayUpdate"></span>
</div>

</div>

<div id="dayList"></div>

</section>


<section
id="longterm"
class="section">

<div class="section-title">

<h2>🚀 長期成長株候補 TOP30</h2>

<div class="update">
更新：
<span id="longUpdate"></span>
</div>

</div>

<div id="longList"></div>

</section>

</div>


<button
class="refresh"
onclick="refreshAll()">
↻ 更新
</button>


<footer>

ランキングは参考情報です。投資助言・利益保証ではありません。

</footer>


<script>

/* =========================================
   日本株候補
========================================= */

const stocks = [

["6857","アドバンテスト","半導体"],
["7011","三菱重工業","防衛・宇宙"],
["7003","三井E&S","造船"],
["5803","フジクラ","AI・データセンター"],
["6146","ディスコ","半導体"],
["8035","東京エレクトロン","半導体"],
["6920","レーザーテック","半導体"],
["7203","トヨタ自動車","自動車"],
["9984","ソフトバンクグループ","AI"],
["6501","日立製作所","DX・インフラ"],

["6758","ソニーグループ","ゲーム・半導体"],
["8316","三井住友FG","銀行"],
["8306","三菱UFJFG","銀行"],
["8766","東京海上HD","保険"],
["8058","三菱商事","総合商社"],
["8001","伊藤忠商事","総合商社"],
["8031","三井物産","総合商社"],
["6861","キーエンス","FA"],
["7741","HOYA","医療・半導体"],
["4063","信越化学工業","半導体材料"],

["6367","ダイキン工業","空調"],
["6981","村田製作所","電子部品"],
["6594","ニデック","モーター"],
["6098","リクルートHD","人材・IT"],
["9433","KDDI","通信"],
["9432","NTT","通信"],
["7974","任天堂","ゲーム"],
["9101","日本郵船","海運"],
["9104","商船三井","海運"],
["5401","日本製鉄","鉄鋼"],

["6702","富士通","IT"],
["6723","ルネサス","半導体"],
["6526","ソシオネクスト","半導体"],
["7735","SCREEN HD","半導体"],
["6503","三菱電機","FA・防衛"],
["7012","川崎重工業","防衛"],
["7013","IHI","航空・防衛"],
["7733","オリンパス","医療"],
["4519","中外製薬","医薬品"],
["4568","第一三共","医薬品"],

["3697","SHIFT","IT"],
["4385","メルカリ","ネット"],
["4689","LINEヤフー","ネット"],
["4755","楽天グループ","通信・ネット"],
["4661","オリエンタルランド","レジャー"],
["9020","JR東日本","鉄道"],
["9022","JR東海","鉄道"],
["9843","ニトリHD","小売"],
["9983","ファーストリテイリング","小売"],
["3382","セブン＆アイHD","小売"]

];


/* =========================================
   疑似市場データ生成
   API接続後ここを本物のデータへ変更
========================================= */

function marketData(stock,index){

const seed =
Date.now()/60000 +
index * 7;

const wave =
Math.sin(seed) *
4;

const random =
(Math.random()-.5) * 3;

const change =
wave + random;

const volumeScore =
50 +
Math.random()*50;

const volatility =
Math.abs(change)*12 +
Math.random()*30;

const trend =
change*7 +
Math.random()*30;

const score =
Math.max(
1,
Math.min(
99,
50 +
volumeScore*.2 +
volatility*.25 +
trend*.25
)
);

return{

code:stock[0],

name:stock[1],

theme:stock[2],

price:
Math.floor(
500 +
Math.random()*9500
),

change:change,

volume:
Math.floor(
200000 +
Math.random()*8000000
),

score:
score

};

}


/* =========================================
   デイトレランキング
========================================= */

function makeDayRanking(){

let data =
stocks.map(
(s,i)=>
marketData(s,i)
);

data.sort(
(a,b)=>
b.score-a.score
);

return data.slice(0,30);

}


/* =========================================
   長期ランキング
========================================= */

function longScore(stock,index){

const growth =
50 +
Math.random()*45;

const finance =
55 +
Math.random()*40;

const future =
55 +
Math.random()*42;

const stability =
45 +
Math.random()*50;

const score =
growth*.30 +
finance*.25 +
future*.30 +
stability*.15;

return{

code:stock[0],

name:stock[1],

theme:stock[2],

score:score,

growth:growth,

finance:finance,

future:future,

stability:stability

};

}


function makeLongRanking(){

let data =
stocks.map(
(s,i)=>
longScore(s,i)
);

data.sort(
(a,b)=>
b.score-a.score
);

return data.slice(0,30);

}


/* =========================================
   順位アイコン
========================================= */

function rankIcon(rank){

if(rank===1)
return "🥇";

if(rank===2)
return "🥈";

if(rank===3)
return "🥉";

return rank+"位";

}


/* =========================================
   デイトレ理由生成
========================================= */

function dayReason(s){

let reasons=[];

if(s.change>3)
reasons.push("強い上昇モメンタム");

if(s.change>1)
reasons.push("短期上昇トレンド");

if(s.volume>4000000)
reasons.push("出来高が多い");

if(Math.abs(s.change)>2.5)
reasons.push("値動きが大きくデイトレ向き");

if(s.score>80)
reasons.push("総合短期スコアが高い");

if(reasons.length<2)
reasons.push("売買活性度を評価");

return reasons.slice(0,3);

}


/* =========================================
   長期理由生成
========================================= */

function longReason(s){

let reasons=[];

if(s.growth>75)
reasons.push("成長力を高評価");

if(s.future>75)
reasons.push("将来市場の拡大期待");

if(s.finance>75)
reasons.push("財務面を高評価");

if(s.stability>75)
reasons.push("長期安定性");

reasons.push(
s.theme+"関連の成長期待"
);

return reasons.slice(0,3);

}


/* =========================================
   表示
========================================= */

function renderDay(){

const list =
document.getElementById(
"dayList"
);

const data =
makeDayRanking();

list.innerHTML="";

data.forEach(
(s,index)=>{

const rank=index+1;

const reasons=
dayReason(s);

const card=
document.createElement(
"div"
);

card.className=
"card "+
(rank===1?"top1":
rank===2?"top2":
rank===3?"top3":"");

card.innerHTML=`

<div class="row">

<div class="rank">
${rankIcon(rank)}
</div>

<div class="info">

<div class="name">
${s.name}
</div>

<div class="code">
${s.code} ・ ${s.theme}
</div>

<div class="price">

参考値
¥${s.price.toLocaleString()}

　

<span class="${s.change>=0?'up':'down'}">

${s.change>=0?'+':''}
${s.change.toFixed(2)}%

</span>

</div>

</div>

<div class="score">

短期スコア

<strong>
${s.score.toFixed(1)}
</strong>

</div>

</div>


<div class="tags">

${reasons.map(
r=>
`<span class="tag">${r}</span>`
).join("")}

</div>


<div class="reason">

<strong>選定理由：</strong>

${reasons.join("・")}

<br>

出来高参考：
${s.volume.toLocaleString()}株

</div>

`;

list.appendChild(card);

});

document.getElementById(
"dayUpdate"
).textContent=
timeText();

}


/* =========================================
   長期表示
========================================= */

function renderLong(){

const list =
document.getElementById(
"longList"
);

const data =
makeLongRanking();

list.innerHTML="";

data.forEach(
(s,index)=>{

const rank=index+1;

const reasons=
longReason(s);

const card=
document.createElement(
"div"
);

card.className=
"card "+
(rank===1?"top1":
rank===2?"top2":
rank===3?"top3":"");

card.innerHTML=`

<div class="row">

<div class="rank">
${rankIcon(rank)}
</div>

<div class="info">

<div class="name">
${s.name}
</div>

<div class="code">
${s.code} ・ ${s.theme}
</div>

</div>

<div class="score">

長期スコア

<strong>
${s.score.toFixed(1)}
</strong>

</div>

</div>


<div class="tags">

${reasons.map(
r=>
`<span class="tag">${r}</span>`
).join("")}

</div>


<div class="reason">

<strong>長期候補理由：</strong>

${reasons.join("・")}

</div>

`;

list.appendChild(card);

});

document.getElementById(
"longUpdate"
).textContent=
timeText();

}


/* =========================================
   時計
========================================= */

function timeText(){

const d=
new Date();

return d.toLocaleTimeString(
"ja-JP",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


/* =========================================
   更新
========================================= */

function refreshAll(){

renderDay();

renderLong();

countdown=60;

}


/* =========================================
   タブ
========================================= */

function showTab(id,button){

document
.querySelectorAll(
".section"
)
.forEach(
el=>
el.classList.remove(
"active"
)
);

document
.querySelectorAll(
".tab"
)
.forEach(
el=>
el.classList.remove(
"active"
)
);

document
.getElementById(id)
.classList.add(
"active"
);

button.classList.add(
"active"
);

}


/* =========================================
   60秒更新
========================================= */

let countdown=60;

setInterval(
()=>{

countdown--;

document.getElementById(
"countdown"
).textContent=
countdown;

if(countdown<=0){

refreshAll();

}

},
1000
);


/* 最初の表示 */

refreshAll();

</script>

</body>
</html>
