<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 17, 31, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1f3550;
      padding: 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #9fb3c8;
    }

    .status-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      background: #10233b;
      border: 1px solid #1e456d;
    }

    .status.ok {
      color: #62f7a7;
    }

    .status.error {
      color: #ff7070;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 18px 14px 60px;
    }

    .notice {
      background: #101d2d;
      border: 1px solid #243b55;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #b8c9da;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab-button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #10233b;
      color: #cbd8e5;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .tab-button.active {
      background: linear-gradient(135deg, #1677ff, #00a8ff);
      color: white;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 21px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }

    .card {
      position: relative;
      background:
        linear-gradient(
          145deg,
          rgba(16, 35, 59, 0.98),
          rgba(8, 20, 35, 0.98)
        );
      border: 1px solid #1e3b59;
      border-radius: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .card.top1 {
      border: 1px solid #ffd45a;
      box-shadow: 0 0 22px rgba(255, 212, 90, 0.16);
    }

    .card.top2 {
      border: 1px solid #cdd7df;
    }

    .card.top3 {
      border: 1px solid #d38a52;
    }

    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .rank {
      font-size: 24px;
      font-weight: 800;
      color: #5eb6ff;
    }

    .rank.rank1 {
      color: #ffd34d;
    }

    .rank.rank2 {
      color: #d9e4ed;
    }

    .rank.rank3 {
      color: #e49a66;
    }

    .score {
      font-size: 14px;
      font-weight: bold;
      padding: 5px 9px;
      border-radius: 999px;
      background: #16324e;
      color: #7dc4ff;
    }

    .stock-name {
      font-size: 19px;
      font-weight: 800;
      margin-top: 10px;
    }

    .stock-code {
      font-size: 12px;
      color: #8299ae;
      margin-top: 3px;
    }

    .price {
      margin-top: 12px;
      font-size: 26px;
      font-weight: 800;
    }

    .price small {
      font-size: 13px;
      color: #9bb0c4;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      background: #091728;
      border-radius: 10px;
      padding: 9px;
    }

    .metric-label {
      font-size: 11px;
      color: #8299ae;
    }

    .metric-value {
      margin-top: 3px;
      font-size: 16px;
      font-weight: bold;
    }

    .positive {
      color: #54e89b;
    }

    .negative {
      color: #ff6e7c;
    }

    .neutral {
      color: #d5dde5;
    }

    .reason {
      margin-top: 12px;
      padding: 10px;
      background: rgba(16, 45, 70, 0.7);
      border-radius: 10px;
      color: #c5d6e6;
      font-size: 13px;
      line-height: 1.55;
    }

    .signal {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: bold;
      padding: 5px 8px;
      border-radius: 7px;
    }

    .signal.strong {
      background: rgba(31, 200, 116, 0.16);
      color: #59eca5;
      border: 1px solid rgba(89, 236, 165, 0.35);
    }

    .signal.medium {
      background: rgba(255, 190, 55, 0.14);
      color: #ffd063;
      border: 1px solid rgba(255, 208, 99, 0.3);
    }

    .signal.watch {
      background: rgba(70, 145, 255, 0.13);
      color: #78b7ff;
      border: 1px solid rgba(120, 183, 255, 0.3);
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      color: #8ca5ba;
      font-size: 15px;
    }

    .error-box {
      background: #38171d;
      color: #ff9da6;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #7d2e39;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #607b92;
      font-size: 12px;
      padding: 25px 10px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 14px;
      }

      .price {
        font-size: 24px;
      }

      .stock-name {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <h1>📈 日本株 AIランキング</h1>

    <div class="subtitle">
      デイトレ候補・長期成長株候補を自動ランキング
    </div>

    <div class="status-area">

      <div id="connectionStatus" class="status">
        ● データ取得中
      </div>

      <div id="updatedStatus" class="status">
        更新時刻：--
      </div>

      <div id="countdownStatus" class="status">
        次回更新：60秒
      </div>

    </div>

  </div>
</header>

<main>

  <div id="notice" class="notice">
    ランキングデータを読み込んでいます。
  </div>

  <div class="tabs">

    <button
      class="tab-button active"
      onclick="showTab('daytrade', this)"
    >
      ⚡ デイトレ TOP30
    </button>

    <button
      class="tab-button"
      onclick="showTab('longterm', this)"
    >
      🚀 長期保有 TOP30
    </button>

  </div>


  <!-- デイトレ -->

  <section
    id="daytradeSection"
    class="section active"
  >

    <h2 class="section-title">
      ⚡ デイトレ候補ランキング
    </h2>

    <div
      id="daytradeCards"
      class="cards"
    >

      <div class="loading">
        データ取得中...
      </div>

    </div>

  </section>


  <!-- 長期 -->

  <section
    id="longtermSection"
    class="section"
  >

    <h2 class="section-title">
      🚀 長期成長株ランキング
    </h2>

    <div
      id="longtermCards"
      class="cards"
    >

      <div class="loading">
        データ取得中...
      </div>

    </div>

  </section>

</main>


<footer>

  株式投資には価格変動リスクがあります。<br>
  本ランキングは投資判断の参考情報であり、
  利益を保証するものではありません。

</footer>


<script>

  /*
  =====================================================
  Apps Script Webアプリ URL
  =====================================================
  */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwO7wWUeLTTy6QXq1lR5odHNSpUGpEwgvxG4eFq9baS9P5vUOo5FN6Tfvx1sUQZVHizNg/exec";


  /*
  =====================================================
  更新設定
  =====================================================
  */

  const REFRESH_SECONDS = 60;

  let countdown = REFRESH_SECONDS;


  /*
  =====================================================
  タブ切り替え
  =====================================================
  */

  function showTab(type, button) {

    document
      .querySelectorAll(".tab-button")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");


    document
      .querySelectorAll(".section")
      .forEach(section => section.classList.remove("active"));


    if (type === "daytrade") {

      document
        .getElementById("daytradeSection")
        .classList.add("active");

    } else {

      document
        .getElementById("longtermSection")
        .classList.add("active");

    }

  }


  /*
  =====================================================
  数値表示
  =====================================================
  */

  function formatNumber(value) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {
      return "--";
    }

    const number = Number(value);

    if (Number.isNaN(number)) {
      return value;
    }

    return number.toLocaleString("ja-JP", {
      maximumFractionDigits: 2
    });

  }


  function formatPercent(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "--";
    }

    const num = Number(value);

    if (Number.isNaN(num)) {
      return "--";
    }

    return `${num >= 0 ? "+" : ""}${num.toFixed(2)}%`;

  }


  function valueClass(value) {

    const num = Number(value);

    if (num > 0) {
      return "positive";
    }

    if (num < 0) {
      return "negative";
    }

    return "neutral";

  }


  /*
  =====================================================
  順位色
  =====================================================
  */

  function rankClass(rank) {

    if (rank === 1) return "rank1";

    if (rank === 2) return "rank2";

    if (rank === 3) return "rank3";

    return "";

  }


  function cardClass(rank) {

    if (rank === 1) return "top1";

    if (rank === 2) return "top2";

    if (rank === 3) return "top3";

    return "";

  }


  function rankIcon(rank) {

    if (rank === 1) return "🥇";

    if (rank === 2) return "🥈";

    if (rank === 3) return "🥉";

    return `${rank}位`;

  }


  /*
  =====================================================
  スコアによる判定
  =====================================================
  */

  function getSignal(score, type) {

    const num = Number(score);


    if (type === "daytrade") {

      if (num >= 70) {

        return {
          text: "🔥 強い注目",
          className: "strong"
        };

      }

      if (num >= 60) {

        return {
          text: "📈 注目",
          className: "medium"
        };

      }

      return {
        text: "👀 監視候補",
        className: "watch"
      };

    }


    if (num >= 125) {

      return {
        text: "🚀 強い成長トレンド",
        className: "strong"
      };

    }

    if (num >= 110) {

      return {
        text: "📈 成長候補",
        className: "medium"
      };

    }

    return {
      text: "👀 長期監視",
      className: "watch"
    };

  }


  /*
  =====================================================
  デイトレ表示
  =====================================================
  */

  function renderDaytrade(data) {

    const container =
      document.getElementById("daytradeCards");


    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      container.innerHTML = `
        <div class="error-box">
          デイトレランキングがありません。
        </div>
      `;

      return;
    }


    container.innerHTML =
      data.map(stock => {

        const signal =
          getSignal(stock.score, "daytrade");


        return `

        <article
          class="card ${cardClass(stock.rank)}"
        >

          <div class="rank-row">

            <div
              class="rank ${rankClass(stock.rank)}"
            >
              ${rankIcon(stock.rank)}
            </div>

            <div class="score">
              AI SCORE
              ${formatNumber(stock.score)}
            </div>

          </div>


          <div class="stock-name">
            ${stock.name}
          </div>

          <div class="stock-code">
            ${stock.code}
            /
            ${stock.symbol}
          </div>


          <div class="price">
            ¥${formatNumber(stock.price)}
            <small>現在値</small>
          </div>


          <div class="metrics">

            <div class="metric">

              <div class="metric-label">
                当日騰落率
              </div>

              <div
                class="metric-value
                ${valueClass(stock.change)}"
              >
                ${formatPercent(stock.change)}
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                短期モメンタム
              </div>

              <div
                class="metric-value
                ${valueClass(stock.momentum)}"
              >
                ${formatPercent(stock.momentum)}
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                出来高倍率
              </div>

              <div class="metric-value">
                ${formatNumber(stock.volumeRatio)}倍
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                AIスコア
              </div>

              <div class="metric-value">
                ${formatNumber(stock.score)}
              </div>

            </div>

          </div>


          <div
            class="signal ${signal.className}"
          >
            ${signal.text}
          </div>


          <div class="reason">

            <strong>選定理由</strong><br>

            ${stock.reason || "総合評価"}

          </div>


        </article>

        `;

      }).join("");

  }


  /*
  =====================================================
  長期ランキング表示
  =====================================================
  */

  function renderLongterm(data) {

    const container =
      document.getElementById("longtermCards");


    if (
      !Array.isArray(data) ||
      data.length === 0
    ) {

      container.innerHTML = `
        <div class="error-box">
          長期ランキングがありません。
        </div>
      `;

      return;
    }


    container.innerHTML =
      data.map(stock => {

        const signal =
          getSignal(stock.score, "longterm");


        return `

        <article
          class="card ${cardClass(stock.rank)}"
        >

          <div class="rank-row">

            <div
              class="rank ${rankClass(stock.rank)}"
            >
              ${rankIcon(stock.rank)}
            </div>

            <div class="score">
              AI SCORE
              ${formatNumber(stock.score)}
            </div>

          </div>


          <div class="stock-name">
            ${stock.name}
          </div>

          <div class="stock-code">
            ${stock.code}
            /
            ${stock.symbol}
          </div>


          <div class="price">

            ¥${formatNumber(stock.price)}

            <small>
              現在値
            </small>

          </div>


          <div class="metrics">


            <div class="metric">

              <div class="metric-label">
                6か月
              </div>

              <div
                class="metric-value
                ${valueClass(stock.sixMonth)}"
              >
                ${formatPercent(stock.sixMonth)}
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                1か月
              </div>

              <div
                class="metric-value
                ${valueClass(stock.oneMonth)}"
              >
                ${formatPercent(stock.oneMonth)}
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                20日移動平均
              </div>

              <div class="metric-value">
                ¥${formatNumber(stock.ma20)}
              </div>

            </div>


            <div class="metric">

              <div class="metric-label">
                60日移動平均
              </div>

              <div class="metric-value">
                ¥${formatNumber(stock.ma60)}
              </div>

            </div>


          </div>


          <div
            class="signal ${signal.className}"
          >
            ${signal.text}
          </div>


          <div class="reason">

            <strong>選定理由</strong><br>

            ${stock.reason || "総合評価"}

          </div>


        </article>

        `;

      }).join("");

  }


  /*
  =====================================================
  データ取得
  =====================================================
  */

  async function loadData() {

    const connection =
      document.getElementById("connectionStatus");


    connection.textContent =
      "● データ更新中";

    connection.className =
      "status";


    try {

      /*
      キャッシュ防止用パラメータ
      */

      const url =
        API_URL +
        "?t=" +
        new Date().getTime();


      const response =
        await fetch(url, {
          method: "GET",
          cache: "no-store"
        });


      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const data =
        await response.json();


      if (data.status !== "ok") {

        throw new Error(
          data.message ||
          "APIステータスエラー"
        );

      }


      renderDaytrade(
        data.daytrade || []
      );


      renderLongterm(
        data.longterm || []
      );


      document
        .getElementById("notice")
        .textContent =
          data.notice ||
          "ランキングは参考情報です。";


      document
        .getElementById("updatedStatus")
        .textContent =
          `更新時刻：${data.updated || "--"}`;


      connection.textContent =
        "● 接続正常";

      connection.className =
        "status ok";


      countdown =
        REFRESH_SECONDS;


    } catch (error) {

      console.error(error);


      connection.textContent =
        "● データ取得失敗";

      connection.className =
        "status error";


      document
        .getElementById("daytradeCards")
        .innerHTML = `

          <div class="error-box">

            データを取得できませんでした。<br><br>

            ${error.message}

          </div>

        `;


      document
        .getElementById("longtermCards")
        .innerHTML = `

          <div class="error-box">

            データを取得できませんでした。<br><br>

            ${error.message}

          </div>

        `;

    }

  }


  /*
  =====================================================
  1秒ごとのカウントダウン
  =====================================================
  */

  setInterval(() => {

    countdown--;

    if (countdown <= 0) {

      countdown =
        REFRESH_SECONDS;

      loadData();

    }


    document
      .getElementById("countdownStatus")
      .textContent =
        `次回更新：${countdown}秒`;

  }, 1000);


  /*
  =====================================================
  初回読み込み
  =====================================================
  */

  loadData();

</script>

</body>
</html>
