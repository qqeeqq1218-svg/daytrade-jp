<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイトレード収支管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 28px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  color: #cbd5e1;
  margin-bottom: 0;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
}

.stat {
  text-align: center;
}

.stat-title {
  color: #666;
  font-weight: bold;
}

.stat-number {
  font-size: 34px;
  font-weight: bold;
  margin-top: 8px;
}

.profit {
  color: #e53935;
}

.loss {
  color: #1976d2;
}

.green {
  color: #00a65a;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  margin-top: 18px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.delete-btn {
  width: auto;
  padding: 7px 12px;
  margin: 0;
  background: #ef4444;
  font-size: 13px;
}

.stock {
  border-left: 6px solid #ef4444;
  background: #fff;
  padding: 16px;
  margin-bottom: 12px;
  border-radius: 12px;
}

.stock-name {
  font-size: 19px;
  font-weight: bold;
}

.stock-info {
  margin-top: 7px;
  color: #555;
}

.rank {
  display: inline-block;
  background: #ef4444;
  color: white;
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 13px;
  margin-right: 6px;
}

.badge {
  display: inline-block;
  background: #dcfce7;
  color: #15803d;
  font-weight: bold;
  padding: 5px 10px;
  border-radius: 20px;
  margin-top: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 10px 5px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

th {
  color: #555;
}

.note {
  font-size: 12px;
  color: #777;
  margin-top: 10px;
}

@media(max-width:600px) {
  .grid {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📈 デイトレード収支管理</h1>
  <p>毎日の利益・損失・勝率・注目銘柄を管理</p>
</header>

<div class="container">

  <!-- 成績 -->
  <div class="grid">

    <div class="card stat">
      <div class="stat-title">合計収支</div>
      <div id="totalProfit" class="stat-number profit">¥0</div>
    </div>

    <div class="card stat">
      <div class="stat-title">勝率</div>
      <div id="winRate" class="stat-number green">0%</div>
    </div>

    <div class="card stat">
      <div class="stat-title">勝ち</div>
      <div id="wins" class="stat-number profit">0回</div>
    </div>

    <div class="card stat">
      <div class="stat-title">負け</div>
      <div id="losses" class="stat-number loss">0回</div>
    </div>

  </div>


  <!-- 注目銘柄 -->
  <div class="card">

    <h2>🏆 デイトレ注目銘柄</h2>

    <div class="stock">
      <div>
        <span class="rank">1位</span>
        <span class="stock-name">7203 トヨタ自動車</span>
      </div>

      <div class="stock-info">
        出来高・値動きをチェック
      </div>

      <span class="badge">
        🔥 注目候補
      </span>
    </div>


    <div class="stock">
      <div>
        <span class="rank">2位</span>
        <span class="stock-name">8306 三菱UFJ</span>
      </div>

      <div class="stock-info">
        高出来高銘柄
      </div>

      <span class="badge">
        👀 監視候補
      </span>
    </div>


    <div class="stock">
      <div>
        <span class="rank">3位</span>
        <span class="stock-name">9984 ソフトバンクG</span>
      </div>

      <div class="stock-info">
        値動きの大きさをチェック
      </div>

      <span class="badge">
        ⚡ デイトレ候補
      </span>
    </div>

    <div class="note">
      ※表示銘柄は売買を推奨するものではありません。
      実際の株価・出来高・ニュースを確認して判断してください。
    </div>

  </div>


  <!-- 取引登録 -->
  <div class="card">

    <h2>取引を追加</h2>

    <label>日付</label>
    <input type="date" id="date">

    <label>銘柄コード</label>
    <input
      type="text"
      id="code"
      placeholder="例：7203"
    >

    <label>銘柄名</label>
    <input
      type="text"
      id="stockName"
      placeholder="例：トヨタ自動車"
    >

    <label>利益・損失</label>
    <input
      type="number"
      id="profit"
      placeholder="例：5000 または -3000"
    >

    <button onclick="addTrade()">
      取引を保存
    </button>

  </div>


  <!-- 銘柄別 -->
  <div class="card">

    <h2>🏅 銘柄別成績</h2>

    <div id="stockRanking">
      まだ取引データがありません
    </div>

  </div>


  <!-- 履歴 -->
  <div class="card">

    <h2>取引履歴</h2>

    <div style="overflow-x:auto">

      <table>

        <thead>
          <tr>
            <th>日付</th>
            <th>銘柄</th>
            <th>収支</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="history"></tbody>

      </table>

    </div>

    <button
      onclick="clearTrades()"
      style="background:#777"
    >
      全履歴を削除
    </button>

  </div>

</div>


<script>

let trades =
JSON.parse(localStorage.getItem("dayTrades")) || [];


/* 今日の日付 */

const today =
new Date().toISOString().split("T")[0];

document.getElementById("date").value = today;


/* 取引追加 */

function addTrade() {

  const date =
    document.getElementById("date").value;

  const code =
    document.getElementById("code").value.trim();

  const stockName =
    document.getElementById("stockName").value.trim();

  const profit =
    Number(document.getElementById("profit").value);


  if (!date) {
    alert("日付を入力してください");
    return;
  }

  if (!code) {
    alert("銘柄コードを入力してください");
    return;
  }

  if (!stockName) {
    alert("銘柄名を入力してください");
    return;
  }

  if (
    document.getElementById("profit").value === ""
  ) {
    alert("利益・損失を入力してください");
    return;
  }


  trades.push({

    id: Date.now(),
    date: date,
    code: code,
    name: stockName,
    profit: profit

  });


  saveTrades();


  document.getElementById("code").value = "";
  document.getElementById("stockName").value = "";
  document.getElementById("profit").value = "";

}


/* 保存 */

function saveTrades() {

  localStorage.setItem(
    "dayTrades",
    JSON.stringify(trades)
  );

  updateScreen();

}


/* 削除 */

function deleteTrade(id) {

  trades =
    trades.filter(trade => trade.id !== id);

  saveTrades();

}


/* 全削除 */

function clearTrades() {

  if (
    confirm("すべての取引履歴を削除しますか？")
  ) {

    trades = [];

    saveTrades();

  }

}


/* 画面更新 */

function updateScreen() {

  let total = 0;
  let wins = 0;
  let losses = 0;


  trades.forEach(trade => {

    total += trade.profit;

    if (trade.profit > 0) {
      wins++;
    }

    if (trade.profit < 0) {
      losses++;
    }

  });


  const totalTrades =
    wins + losses;


  const winRate =
    totalTrades > 0
    ? Math.round(wins / totalTrades * 100)
    : 0;


  const totalElement =
    document.getElementById("totalProfit");


  totalElement.textContent =
    (total >= 0 ? "+" : "") +
    "¥" +
    total.toLocaleString();


  if (total >= 0) {
    totalElement.className =
      "stat-number profit";
  } else {
    totalElement.className =
      "stat-number loss";
  }


  document.getElementById("wins")
    .textContent =
    wins + "回";


  document.getElementById("losses")
    .textContent =
    losses + "回";


  document.getElementById("winRate")
    .textContent =
    winRate + "%";


  updateHistory();

  updateRanking();

}


/* 履歴 */

function updateHistory() {

  const history =
    document.getElementById("history");

  history.innerHTML = "";


  const reversed =
    [...trades].reverse();


  reversed.forEach(trade => {

    const tr =
      document.createElement("tr");


    const profitText =
      (trade.profit >= 0 ? "+" : "") +
      "¥" +
      trade.profit.toLocaleString();


    tr.innerHTML = `

      <td>
        ${trade.date}
      </td>

      <td>
        ${trade.code}<br>
        ${trade.name}
      </td>

      <td style="
        font-weight:bold;
        color:${
          trade.profit >= 0
          ? "#e53935"
          : "#1976d2"
        }
      ">
        ${profitText}
      </td>

      <td>
        <button
          class="delete-btn"
          onclick="deleteTrade(${trade.id})"
        >
          削除
        </button>
      </td>

    `;


    history.appendChild(tr);

  });

}


/* 銘柄別ランキング */

function updateRanking() {

  const ranking =
    document.getElementById("stockRanking");


  if (trades.length === 0) {

    ranking.innerHTML =
      "まだ取引データがありません";

    return;

  }


  const stocks = {};


  trades.forEach(trade => {

    const key =
      trade.code + " " + trade.name;


    if (!stocks[key]) {

      stocks[key] = {
        profit: 0,
        wins: 0,
        losses: 0,
        trades: 0
      };

    }


    stocks[key].profit += trade.profit;
    stocks[key].trades++;


    if (trade.profit > 0) {
      stocks[key].wins++;
    }


    if (trade.profit < 0) {
      stocks[key].losses++;
    }

  });


  const sorted =
    Object.entries(stocks)
    .sort(
      (a,b) =>
      b[1].profit - a[1].profit
    );


  let html = "";


  sorted.forEach(
    ([name,data],index) => {


      const winRate =
        data.trades > 0
        ? Math.round(
            data.wins /
            data.trades *
            100
          )
        : 0;


      html += `

        <div class="stock">

          <div class="stock-name">

            ${index + 1}位
            ${name}

          </div>

          <div class="stock-info">

            合計収支：

            <strong
              style="
              color:${
                data.profit >= 0
                ? "#e53935"
                : "#1976d2"
              }">

              ${
                data.profit >= 0
                ? "+"
                : ""
              }

              ¥${data.profit.toLocaleString()}

            </strong>

            <br>

            取引：
            ${data.trades}回

            ／ 勝率：
            ${winRate}%

          </div>

        </div>

      `;

  });


  ranking.innerHTML = html;

}


/* 起動 */

updateScreen();

</script>

</body>
</html>
