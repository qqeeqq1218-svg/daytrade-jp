<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #0b1020;
      color: #ffffff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 16, 32, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #26304d;
      padding: 14px 12px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      text-align: center;
      color: #ffffff;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #a9b4d0;
      margin-top: 5px;
    }

    .status-area {
      max-width: 1200px;
      margin: 12px auto 0;
      padding: 0 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #18213a;
      border: 1px solid #2c395d;
    }

    .online {
      color: #57e389;
    }

    .offline {
      color: #ff6b6b;
    }

    .loading {
      color: #ffd166;
    }

    .updated {
      font-size: 12px;
      color: #a9b4d0;
    }

    .refresh-btn {
      border: 0;
      border-radius: 20px;
      padding: 8px 15px;
      background: #2864ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 12px;
    }

    .notice {
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      background: #171f35;
      border: 1px solid #2d395d;
      color: #bac4dd;
      font-size: 12px;
      line-height: 1.6;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      padding: 13px 8px;
      border: 1px solid #2b385d;
      border-radius: 10px;
      background: #131b30;
      color: #bec9e4;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.active {
      background: #2864ff;
      border-color: #2864ff;
      color: #ffffff;
    }

    .section-title {
      font-size: 20px;
      margin: 10px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .count {
      font-size: 12px;
      color: #8793b2;
    }

    .ranking {
      display: grid;
      gap: 10px;
    }

    .stock-card {
      background: linear-gradient(
        145deg,
        #151d32,
        #10172a
      );
      border: 1px solid #273455;
      border-radius: 14px;
      padding: 13px;
      position: relative;
      overflow: hidden;
    }

    .stock-card.strong-buy {
      border-left: 5px solid #00d878;
    }

    .stock-card.buy {
      border-left: 5px solid #4caf50;
    }

    .stock-card.watch {
      border-left: 5px solid #ffd166;
    }

    .stock-card.caution {
      border-left: 5px solid #ff6b6b;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank {
      min-width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #202b48;
      font-weight: bold;
      font-size: 15px;
    }

    .rank1 {
      background: linear-gradient(
        135deg,
        #ffd700,
        #b8860b
      );
      color: #111;
    }

    .rank2 {
      background: linear-gradient(
        135deg,
        #eeeeee,
        #999999
      );
      color: #111;
    }

    .rank3 {
      background: linear-gradient(
        135deg,
        #cd7f32,
        #7c431c
      );
    }

    .stock-main {
      flex: 1;
      min-width: 0;
    }

    .stock-name {
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: #536690;
      text-underline-offset: 3px;
    }

    .stock-name:hover {
      color: #6ea0ff;
    }

    .code {
      color: #8594b5;
      font-size: 12px;
      margin-top: 3px;
    }

    .signal {
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }

    .signal-strong {
      background: rgba(0, 216, 120, 0.15);
      color: #4bf09c;
    }

    .signal-buy {
      background: rgba(76, 175, 80, 0.15);
      color: #79df7e;
    }

    .signal-watch {
      background: rgba(255, 209, 102, 0.15);
      color: #ffd166;
    }

    .signal-caution {
      background: rgba(255, 107, 107, 0.15);
      color: #ff8080;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .stat {
      background: #0c1427;
      border-radius: 9px;
      padding: 8px 5px;
      text-align: center;
    }

    .stat-label {
      color: #7886a9;
      font-size: 10px;
      margin-bottom: 3px;
    }

    .stat-value {
      font-size: 14px;
      font-weight: bold;
    }

    .positive {
      color: #4be394;
    }

    .negative {
      color: #ff7070;
    }

    .score {
      color: #6da0ff;
    }

    .reason {
      margin-top: 10px;
      padding: 9px;
      background: #111a2f;
      border-radius: 8px;
      color: #bdc7df;
      font-size: 12px;
      line-height: 1.55;
    }

    .reason strong {
      color: #ffffff;
    }

    .score-bar {
      width: 100%;
      height: 5px;
      margin-top: 10px;
      border-radius: 10px;
      background: #27304b;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: linear-gradient(
        90deg,
        #2864ff,
        #00d878
      );
    }

    .empty {
      padding: 40px 15px;
      text-align: center;
      color: #8491af;
      background: #11182b;
      border-radius: 12px;
    }

    .error-box {
      background: rgba(255, 80, 80, 0.12);
      color: #ff9898;
      padding: 14px;
      border: 1px solid rgba(255, 80, 80, 0.35);
      border-radius: 10px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #667493;
      font-size: 11px;
      padding: 30px 15px;
      line-height: 1.7;
    }

    @media (min-width: 720px) {
      .ranking {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1050px) {
      .ranking {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 420px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .stock-name {
        font-size: 16px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>📈 日本株 AIランキング</h1>
    <div class="subtitle">
      デイトレ・長期保有候補を自動ランキング
    </div>

    <div class="status-area">
      <div id="status" class="status loading">
        ● データ取得中
      </div>

      <div id="updated" class="updated">
        更新時刻：--
      </div>

      <button
        class="refresh-btn"
        onclick="loadData()"
      >
        🔄 更新
      </button>
    </div>
  </div>
</header>


<div class="container">

  <div id="notice" class="notice">
    AIスコアは参考情報です。利益を保証するものではありません。
  </div>

  <div class="tabs">

    <button
      id="dayTab"
      class="tab active"
      onclick="showTab('daytrade')"
    >
      ⚡ デイトレ
    </button>

    <button
      id="longTab"
      class="tab"
      onclick="showTab('longterm')"
    >
      🏦 長期保有
    </button>

  </div>


  <div id="daytradeSection">

    <div class="section-title">
      <span>⚡ デイトレ候補 TOP30</span>
      <span
        id="dayCount"
        class="count"
      ></span>
    </div>

    <div
      id="daytradeRanking"
      class="ranking"
    >
      <div class="empty">
        データ取得中...
      </div>
    </div>

  </div>


  <div
    id="longtermSection"
    style="display:none;"
  >

    <div class="section-title">
      <span>🏦 長期保有候補 TOP30</span>
      <span
        id="longCount"
        class="count"
      ></span>
    </div>

    <div
      id="longtermRanking"
      class="ranking"
    >
      <div class="empty">
        データ取得中...
      </div>
    </div>

  </div>

</div>


<footer>
  本ランキングは株式投資の参考情報です。<br>
  投資判断はご自身の責任で行ってください。<br>
  1分ごとにランキングを自動更新します。
</footer>


<script>

/* ========================================
   Apps Script API URL
======================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbzeqcEzNlRH-PEGz3TDI3sFWaUFyR78rrrNxaRxYvf7UmbL_dpskLCRyQngToRahE0WYA/exec";


/* ========================================
   設定
======================================== */

const REFRESH_INTERVAL = 60 * 1000;

let currentTab = "daytrade";


/* ========================================
   データ取得
======================================== */

async function loadData() {

  const status = document.getElementById("status");

  status.textContent = "● データ取得中";
  status.className = "status loading";

  try {

    /*
      キャッシュ防止用に時刻を追加
    */

    const url =
      API_URL +
      "?t=" +
      new Date().getTime();

    const response = await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "HTTPエラー：" + response.status
      );
    }

    const data = await response.json();

    if (
      !data ||
      data.status !== "ok"
    ) {
      throw new Error(
        data?.message ||
        "APIから正常なデータが返されませんでした"
      );
    }

    status.textContent = "● API接続中";
    status.className = "status online";

    document.getElementById(
      "updated"
    ).textContent =
      "更新時刻：" +
      (
        data.updated ||
        new Date().toLocaleTimeString("ja-JP")
      );

    if (data.notice) {
      document.getElementById(
        "notice"
      ).textContent = data.notice;
    }


    /* デイトレ */

    renderRanking(
      data.daytrade || [],
      "daytradeRanking",
      "daytrade"
    );


    /* 長期 */

    renderRanking(
      data.longterm || [],
      "longtermRanking",
      "longterm"
    );


    document.getElementById(
      "dayCount"
    ).textContent =
      (data.daytrade || []).length +
      "銘柄";

    document.getElementById(
      "longCount"
    ).textContent =
      (data.longterm || []).length +
      "銘柄";


  } catch (error) {

    console.error(error);

    status.textContent = "● 接続エラー";
    status.className = "status offline";

    const message = `
      <div class="error-box">
        データ取得に失敗しました。<br><br>
        ${escapeHtml(error.message)}
        <br><br>
        Apps Scriptの公開設定と
        API URLを確認してください。
      </div>
    `;

    document.getElementById(
      "daytradeRanking"
    ).innerHTML = message;

    document.getElementById(
      "longtermRanking"
    ).innerHTML = message;
  }
}


/* ========================================
   ランキング表示
======================================== */

function renderRanking(
  stocks,
  elementId,
  type
) {

  const element =
    document.getElementById(elementId);

  if (!stocks || stocks.length === 0) {

    element.innerHTML = `
      <div class="empty">
        現在ランキングデータがありません。
      </div>
    `;

    return;
  }


  const top30 =
    stocks
      .slice(0, 30);


  element.innerHTML =
    top30
      .map(stock =>
        createStockCard(
          stock,
          type
        )
      )
      .join("");
}


/* ========================================
   銘柄カード
======================================== */

function createStockCard(
  stock,
  type
) {

  const rank =
    Number(stock.rank || 0);

  const score =
    Number(stock.score || 0);

  const price =
    Number(stock.price || 0);

  const change =
    Number(stock.change || 0);

  const momentum =
    Number(stock.momentum || 0);

  const volumeRatio =
    Number(stock.volumeRatio || 0);

  const signal =
    getSignal(
      score,
      change,
      type
    );


  let rankClass = "";

  if (rank === 1) {
    rankClass = "rank1";
  }

  if (rank === 2) {
    rankClass = "rank2";
  }

  if (rank === 3) {
    rankClass = "rank3";
  }


  const changeClass =
    change >= 0
      ? "positive"
      : "negative";


  const momentumClass =
    momentum >= 0
      ? "positive"
      : "negative";


  return `

    <div
      class="stock-card ${signal.cardClass}"
    >

      <div class="card-top">

        <div
          class="rank ${rankClass}"
        >
          ${rank}位
        </div>


        <div class="stock-main">

          <div
            class="stock-name"
            onclick="openChart('${escapeAttr(
              stock.symbol ||
              stock.code
            )}')"
          >
            ${escapeHtml(
              stock.name || "名称なし"
            )}
          </div>

          <div class="code">
            ${
              escapeHtml(
                stock.code || ""
              )
            }
          </div>

        </div>


        <div
          class="signal ${signal.signalClass}"
        >
          ${signal.text}
        </div>

      </div>


      <div class="stats">

        <div class="stat">
          <div class="stat-label">
            現在値
          </div>

          <div class="stat-value">
            ¥${formatNumber(price)}
          </div>
        </div>


        <div class="stat">
          <div class="stat-label">
            前日比
          </div>

          <div
            class="stat-value ${changeClass}"
          >
            ${
              change >= 0
                ? "+"
                : ""
            }${change.toFixed(2)}%
          </div>
        </div>


        <div class="stat">
          <div class="stat-label">
            モメンタム
          </div>

          <div
            class="stat-value ${momentumClass}"
          >
            ${
              momentum >= 0
                ? "+"
                : ""
            }${momentum.toFixed(2)}
          </div>
        </div>


        <div class="stat">
          <div class="stat-label">
            AIスコア
          </div>

          <div class="stat-value score">
            ${score.toFixed(1)}
          </div>
        </div>

      </div>


      ${
        type === "daytrade"
          ? `
            <div
              class="stats"
              style="
                grid-template-columns:1fr;
                margin-top:7px;
              "
            >

              <div class="stat">

                <div class="stat-label">
                  出来高倍率
                </div>

                <div class="stat-value">
                  ${volumeRatio.toFixed(2)}倍
                </div>

              </div>

            </div>
          `
          : ""
      }


      <div class="score-bar">
        <div
          class="score-bar-fill"
          style="
            width:${Math.min(
              100,
              Math.max(0, score)
            )}%
          "
        ></div>
      </div>


      <div class="reason">

        <strong>
          ${
            type === "daytrade"
              ? "📊 選定理由"
              : "🏦 長期評価"
          }
        </strong>

        <br>

        ${escapeHtml(
          stock.reason ||
          "評価理由なし"
        )}

      </div>

    </div>
  `;
}


/* ========================================
   買い候補判定
======================================== */

function getSignal(
  score,
  change,
  type
) {

  /*
    デイトレ
  */

  if (type === "daytrade") {

    if (
      score >= 85 &&
      change > 0
    ) {

      return {
        text: "🔥 強い候補",
        cardClass: "strong-buy",
        signalClass: "signal-strong"
      };

    }

    if (
      score >= 75 &&
      change >= 0
    ) {

      return {
        text: "🟢 買い候補",
        cardClass: "buy",
        signalClass: "signal-buy"
      };

    }

    if (
      change < -2
    ) {

      return {
        text: "⚠️ 注意",
        cardClass: "caution",
        signalClass: "signal-caution"
      };

    }

    return {
      text: "👀 監視",
      cardClass: "watch",
      signalClass: "signal-watch"
    };
  }


  /*
    長期保有
  */

  if (score >= 90) {

    return {
      text: "🔥 最有力",
      cardClass: "strong-buy",
      signalClass: "signal-strong"
    };

  }

  if (score >= 80) {

    return {
      text: "🟢 有力候補",
      cardClass: "buy",
      signalClass: "signal-buy"
    };

  }

  if (score >= 70) {

    return {
      text: "👀 監視",
      cardClass: "watch",
      signalClass: "signal-watch"
    };

  }

  return {
    text: "⚠️ 注意",
    cardClass: "caution",
    signalClass: "signal-caution"
  };
}


/* ========================================
   株価チャートを開く
======================================== */

function openChart(symbol) {

  if (!symbol) {
    return;
  }

  let cleanSymbol =
    String(symbol).trim();

  /*
    APIが銘柄コードだけを返した場合
  */

  if (
    /^\d{4}$/.test(cleanSymbol)
  ) {
    cleanSymbol += ".T";
  }


  /*
    TradingViewでチャートを開く
  */

  const tradingViewSymbol =
    cleanSymbol
      .replace(".T", "");


  const url =
    "https://www.tradingview.com/chart/?symbol=TSE%3A" +
    encodeURIComponent(
      tradingViewSymbol
    );


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );
}


/* ========================================
   タブ切替
======================================== */

function showTab(tab) {

  currentTab = tab;

  const daySection =
    document.getElementById(
      "daytradeSection"
    );

  const longSection =
    document.getElementById(
      "longtermSection"
    );

  const dayTab =
    document.getElementById(
      "dayTab"
    );

  const longTab =
    document.getElementById(
      "longTab"
    );


  if (tab === "daytrade") {

    daySection.style.display = "block";
    longSection.style.display = "none";

    dayTab.classList.add("active");
    longTab.classList.remove("active");

  } else {

    daySection.style.display = "none";
    longSection.style.display = "block";

    longTab.classList.add("active");
    dayTab.classList.remove("active");

  }
}


/* ========================================
   数字
======================================== */

function formatNumber(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(value)
  ) {
    return "-";
  }

  return Number(value)
    .toLocaleString(
      "ja-JP",
      {
        maximumFractionDigits: 2
      }
    );
}


/* ========================================
   XSS対策
======================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttr(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, "&quot;");
}


/* ========================================
   初回読み込み
======================================== */

loadData();


/* ========================================
   1分ごと自動更新
======================================== */

setInterval(
  loadData,
  REFRESH_INTERVAL
);

</script>

</body>
</html>
