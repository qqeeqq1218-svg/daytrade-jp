<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>日本株 AIランキング</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#061526;
color:#ffffff;
font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
"Noto Sans JP",
sans-serif;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

h1{
font-size:28px;
margin-bottom:5px;
}

.subtitle{
color:#9fb2ca;
font-size:16px;
line-height:1.7;
margin-bottom:25px;
}


/* STATUS */

.status-box{
background:#0d2138;
border:2px solid #164e75;
border-radius:28px;
padding:20px;
margin-bottom:15px;
font-size:18px;
}

.status-ok{
color:#3ee58f;
font-weight:bold;
}

.status-error{
color:#ff6b6b;
font-weight:bold;
}


/* BUTTONS */

.tabs{
display:flex;
gap:10px;
margin:25px 0;
}

.tab{
flex:1;
border:none;
padding:17px 10px;
border-radius:24px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
background:#17355e;
}

.tab.active{
background:#19aef5;
}


/* TABLE */

.panel{
display:none;
}

.panel.active{
display:block;
}

.card{
background:#0c1f35;
border:1px solid #244968;
border-radius:20px;
margin-bottom:14px;
padding:18px;
position:relative;
}

.rank{
font-size:30px;
font-weight:900;
color:#27b7ff;
margin-right:10px;
}

.stock-name{
font-size:22px;
font-weight:800;
}

.stock-code{
font-size:13px;
color:#8faac5;
margin-left:7px;
}

.stock-link{
color:white;
text-decoration:none;
}

.stock-link:hover{
color:#2ac1ff;
}

.price{
font-size:22px;
font-weight:bold;
margin-top:12px;
}

.change-up{
color:#48e694;
}

.change-down{
color:#ff6f7c;
}

.score{
display:inline-block;
margin-top:12px;
padding:7px 12px;
border-radius:15px;
font-weight:bold;
}

.score-high{
background:#174f39;
color:#55efa1;
}

.score-mid{
background:#5a4a15;
color:#ffd95a;
}

.score-low{
background:#54232c;
color:#ff8893;
}

.reason{
color:#b2c3d6;
margin-top:12px;
line-height:1.6;
}

.badge-buy{
display:inline-block;
margin-left:8px;
padding:4px 9px;
border-radius:12px;
background:#15623e;
color:#55efa1;
font-size:12px;
font-weight:bold;
}

.badge-watch{
display:inline-block;
margin-left:8px;
padding:4px 9px;
border-radius:12px;
background:#66541c;
color:#ffe063;
font-size:12px;
font-weight:bold;
}

.badge-risk{
display:inline-block;
margin-left:8px;
padding:4px 9px;
border-radius:12px;
background:#612a34;
color:#ff8893;
font-size:12px;
font-weight:bold;
}

.loading{
text-align:center;
padding:40px;
color:#9fb2ca;
}

.error-box{
background:#102238;
border:2px solid #2b4c6a;
border-radius:22px;
padding:25px;
color:#b5c6d8;
font-size:18px;
line-height:1.8;
}

.notice{
margin-top:35px;
background:#0b1d31;
padding:18px;
border-radius:18px;
color:#90a6be;
font-size:13px;
line-height:1.7;
}

.refresh-button{
width:100%;
padding:16px;
border:none;
border-radius:20px;
font-weight:bold;
font-size:17px;
background:#15395c;
color:white;
margin-top:10px;
cursor:pointer;
}

@media(max-width:600px){

.container{
padding:18px;
}

h1{
font-size:25px;
}

.stock-name{
font-size:19px;
}

.rank{
font-size:25px;
}

}

</style>
</head>


<body>

<div class="container">

<h1>📈 日本株 AIランキング</h1>

<div class="subtitle">
デイトレ候補・長期成長株候補を自動ランキング
</div>


<div class="status-box">

<div id="status">
🔵 データ取得中
</div>

</div>


<div class="status-box">
更新時刻：
<span id="updated">--</span>
</div>


<div class="status-box">
次回更新：
<span id="countdown">60</span>秒
</div>


<button class="refresh-button" onclick="loadData()">
🔄 今すぐ更新
</button>


<div class="tabs">

<button
class="tab active"
onclick="showTab('daytrade',this)">
⚡ デイトレ
</button>

<button
class="tab"
onclick="showTab('longterm',this)">
🚀 長期保有
</button>

</div>


<div
id="daytrade"
class="panel active">

<div class="loading">
ランキング取得中...
</div>

</div>


<div
id="longterm"
class="panel">

<div class="loading">
ランキング取得中...
</div>

</div>


<div class="notice">

⚠️ 本ページのランキング・スコア・売買候補表示は参考情報です。
将来の株価・利益を保証するものではありません。
実際の投資判断はご自身で行ってください。

</div>

</div>


<script>

/* =========================================
   Apps Script API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzeqcEzNlRH-PEGz3TDI3sFWaUFyR78rrrNxaRxYvf7UmbL_dpskLCRyQngToRahE0WYA/exec";


let seconds = 60;

let requestNumber = 0;


/* =========================================
   JSONP
========================================= */

function loadData(){

requestNumber++;

const callbackName =
"stockCallback_" +
Date.now() +
"_" +
requestNumber;


const oldScript =
document.getElementById("apiScript");

if(oldScript){
oldScript.remove();
}


window[callbackName] = function(data){

try{

handleData(data);

}catch(error){

showError(error);

}

delete window[callbackName];

const script =
document.getElementById("apiScript");

if(script){
script.remove();
}

};


const script =
document.createElement("script");

script.id = "apiScript";

script.src =
API_URL +
"?callback=" +
encodeURIComponent(callbackName) +
"&t=" +
Date.now();


script.onerror = function(){

showError(
new Error(
"Apps Script APIに接続できませんでした。"
)
);

delete window[callbackName];

};


document.body.appendChild(script);

}


/* =========================================
   DATA
========================================= */

function handleData(data){

if(!data){
throw new Error("データが空です");
}


if(data.status !== "ok"){
throw new Error(
data.message ||
"APIエラー"
);
}


document.getElementById("status").innerHTML =
'<span class="status-ok">🟢 データ取得成功</span>';


document.getElementById("updated").textContent =
data.updated || "--";


renderRanking(
"daytrade",
data.daytrade || []
);

renderRanking(
"longterm",
data.longterm || []
);


seconds = 60;

}


/* =========================================
   ERROR
========================================= */

function showError(error){

console.error(error);

document.getElementById("status").innerHTML =
'<span class="status-error">🔴 データ取得失敗</span>';


const html = `

<div class="error-box">

データ取得に失敗しました。<br><br>

しばらくしてから自動で再取得します。<br><br>

${escapeHtml(
error.message ||
"通信エラー"
)}

</div>

`;


document.getElementById("daytrade").innerHTML =
html;

document.getElementById("longterm").innerHTML =
html;

}


/* =========================================
   RANKING
========================================= */

function renderRanking(id,data){

const container =
document.getElementById(id);


if(!Array.isArray(data) ||
data.length === 0){

container.innerHTML = `

<div class="error-box">
ランキングデータがありません。
</div>

`;

return;

}


const sorted =
[...data]
.sort(
(a,b) =>
Number(a.rank || 999) -
Number(b.rank || 999)
)
.slice(0,30);


container.innerHTML =
sorted.map(stock => {

const score =
Number(stock.score || 0);

const change =
Number(stock.change || 0);

const price =
Number(stock.price || 0);


let scoreClass =
"score-low";

if(score >= 80){

scoreClass =
"score-high";

}else if(score >= 60){

scoreClass =
"score-mid";

}


let badge = "";

if(score >= 80){

badge =
'<span class="badge-buy">買い候補</span>';

}else if(score >= 60){

badge =
'<span class="badge-watch">注目</span>';

}else{

badge =
'<span class="badge-risk">注意</span>';

}


const changeClass =
change >= 0
?
"change-up"
:
"change-down";


const changeText =
(change >= 0 ? "+" : "") +
change.toFixed(2) +
"%";


const symbol =
stock.symbol ||
(stock.code + ".T");


const chartUrl =
"https://finance.yahoo.co.jp/quote/" +
encodeURIComponent(symbol) +
"/chart";


return `

<div class="card">

<div>

<span class="rank">
${escapeHtml(stock.rank)}
</span>


<a
class="stock-link"
href="${chartUrl}"
target="_blank"
rel="noopener noreferrer">

<span class="stock-name">
${escapeHtml(stock.name || "銘柄")}
</span>

<span class="stock-code">
${escapeHtml(stock.code || "")}
</span>

</a>

</div>


<div class="price">

¥${price.toLocaleString()}

&nbsp;

<span class="${changeClass}">
${changeText}
</span>

</div>


<div>

<span class="score ${scoreClass}">
AIスコア ${score.toFixed(1)}
</span>

${badge}

</div>


<div class="reason">

💡
${escapeHtml(
stock.reason ||
"ランキング条件に該当"
)}

</div>

</div>

`;

}).join("");

}


/* =========================================
   TAB
========================================= */

function showTab(id,button){

document
.querySelectorAll(".panel")
.forEach(el=>{
el.classList.remove("active");
});


document
.querySelectorAll(".tab")
.forEach(el=>{
el.classList.remove("active");
});


document
.getElementById(id)
.classList.add("active");


button.classList.add("active");

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

return String(
value ?? ""
)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================
   COUNTDOWN
========================================= */

setInterval(()=>{

seconds--;

if(seconds <= 0){

seconds = 60;

loadData();

}

document
.getElementById("countdown")
.textContent =
seconds;

},1000);


/* =========================================
   START
========================================= */

loadData();

</script>

</body>
</html>
