<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デイトレード</title>

  <style>
    body {
      margin: 0;
      background: #111827;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    header {
      background: #16a34a;
      padding: 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .box {
      margin: 30px 15px;
      padding: 30px 15px;
      background: #1f2937;
      border-radius: 15px;
    }

    h1 {
      color: #4ade80;
    }

    button {
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<header>
  DAY TRADE JP
</header>

<div class="box">
  <h1>デイトレード管理</h1>
  <p>サイトの公開に成功しました！</p>
  <p>ここからデイトレードアプリを作っていきます。</p>

  <button onclick="alert('正常に動いています！')">
    動作確認
  </button>
</div>

</body>
</html>
