<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: #061426;
      color: #ffffff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .header {
      margin-bottom: 28px;
    }

    .title {
      font-size: clamp(30px, 7vw, 54px);
      font-weight: 900;
      letter-spacing: -1px;
      margin: 0;
    }

    .subtitle {
      color: #a8b8ce;
      font-size: 18px;
      line-height: 1.6;
      margin-top: 16px;
    }

    .status-area {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    .status-box {
      border: 2px solid #18476e;
      background: #0d2036;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 18px;
    }

    .success {
      color: #4df09d;
    }

    .error {
      color: #ff7070;
    }

    .message-box {
      background: #0e2034;
      border: 2px solid #28445f;
      border-radius: 28px;
      padding: 24px;
      margin: 28px 0;
      color: #afbdd0;
      font-size: 18px;
      line-height: 1.7;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 30px 0 38px;
    }

    .tab-button {
      border: 0;
      border-radius: 28px;
      padding: 24px 12px;
      font-size: 23px;
      font-weight: 900;
      color: #fff;
      background: #152d4e;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-button.active {
      background: linear-gradient(135deg, #1798ff, #13c2ea);
      transform: translateY(-2px);
    }

    .section-title {
      font-size: clamp(30px, 7vw, 48px);
      font-weight: 900;
      margin: 0 0 25px;
      line-height: 1.25;
    }

    .ranking-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .stock-card {
      background: #0c1d31;
      border-radius: 22px;
      padding: 18px;
      border: 2px solid #1e3856;
      position: relative;
      overflow: hidden;
    }

    .stock-card.strong-buy {
      border-color: #20d57b;
      background: linear-gradient(
        135deg,
        rgba(28, 213, 123, 0.13),
        #0c1d31 45%
      );
    }

    .stock-card.buy {
      border-color: #4ecb86;
    }

    .stock-card.wait {
      border-color: #e1b84c;
    }

    .stock-card.warning {
      border-color: #dc6060;
    }

    .stock-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
    }

    .rank {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 21px;
      font-weight: 900;
      background: #162d49;
    }

    .rank-1 {
      background: linear-gradient(135deg, #f2cd44, #d79613);
      color: #171717;
    }

    .rank-2 {
      background: linear-gradient(135deg, #dae2eb, #7c8b9d);
      color: #161616;
    }

    .rank-3 {
      background: linear-gradient(135deg, #ce8651, #8c4d27);
    }

    .stock-name {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.4;
    }

    .stock-name a {
      color: #ffffff;
    }

    .stock-name a:hover {
      color: #4ebfff;
    }

    .stock-code {
      color: #8194ab;
      font-size: 14px;
      margin-top: 5px;
    }

    .price-area {
      text-align: right;
    }

    .price {
      font-size: 20px;
      font-weight: 800;
    }

    .change {
      font-size: 15px;
      margin-top: 4px;
    }

    .positive {
      color: #48e28e;
    }

    .negative {
      color: #ff7474;
    }

    .neutral {
      color: #b6c2d0;
    }

    .signal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .signal {
      padding: 8px 13px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 14px;
    }

    .signal-strong {
      background: rgba(25, 220, 125, 0.2);
      color: #5affaf;
    }

    .signal-buy {
      background: rgba(67, 196, 125, 0.17);
      color: #5ae897;
    }

    .signal-wait {
      background: rgba(229, 186, 74, 0.16);
      color: #ffd364;
    }

    .signal-warning {
      background: rgba(224, 81, 81, 0.16);
      color: #ff7c7c;
    }

    .score {
      font-weight: 900;
      font-size: 17px;
    }

    .score-bar-bg {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: #1a3049;
      overflow: hidden;
      margin-top: 13px;
    }

    .score-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1ba8f9, #39e78f);
      transition: width 0.4s;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 16px;
    }

    .metric {
      background: #13283e;
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .metric-label {
      color: #8092aa;
      font-size: 12px;
    }

    .metric-value {
      font-size: 16px;
      font-weight: 800;
      margin-top: 5px;
    }

    .reason {
      border-top: 1px solid #263b52;
      margin-top: 16px;
      padding-top: 14px;
      color: #b0bdd0;
      font-size: 15px;
      line-height: 1.65;
    }

    .open-chart {
      display: inline-block;
      margin-top: 13px;
      padding: 9px 14px;
      border-radius: 11px;
      background: #193654;
      color: #65c5ff;
      font-size: 14px;
      font-weight: 800;
    }

    .empty {
      padding: 40px 15px;
      text-align: center;
      color: #94a4b7;
    }

    .footer {
      text-align: center;
      color: #60748c;
      font-size: 13px;
      margin-top: 45px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 16px 50px;
      }

      .status-box {
        width: 100%;
        font-size: 16px;
      }

      .tabs {
        gap: 10px;
      }

      .tab-button {
        padding: 20px 8px;
        font-size: 19px;
      }

      .stock-top {
        grid-template-columns: auto 1fr;
      }

      .price-area {
        grid-column: 2;
        text-align: left;
      }

      .metrics {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">
    <h1 class="title">📈 日本株 AIランキング</h1>

    <div class="subtitle">
      デイトレ候補・長期成長株候補を自動ランキング
    </div>
  </header>


  <div class="status-area">

    <div id="status" class="status-box">
      🟡 データ取得中...
    </div>

    <div id="updated" class="status-box">
      更新時刻：--
    </div>

    <div id="countdown" class="status-box">
      次回更新：60秒
    </div>

  </div>


  <div id="message" class="message-box">
    ランキングデータを取得しています。
  </div>


  <div class="tabs">

    <button
      id="daytradeBtn"
      class="tab-button active"
      onclick="switchTab('daytrade')"
    >
      ⚡ デイトレ<br>TOP30
    </button>

    <button
      id="longtermBtn"
      class="tab-button"
      onclick="switchTab('longterm')"
    >
      🚀 長期保有<br>TOP30
    </button>

  </div>


  <h2 id="sectionTitle" class="section-title">
    ⚡ デイトレ候補ランキング
  </h2>


  <div id="ranking" class="ranking-list"></div>


  <div class="footer">
    ※ ランキングは参考情報です。<br>
    投資利益を保証するものではありません。<br>
    最終的な投資判断はご自身で行ってください。
  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwO7wWUeLTTy6QXq1lR5odHNSpUGpEwgvxG4eFq9baS9P5vUOo5FN6Tfvx1sUQZVHizNg/exec";


const REFRESH_SECONDS = 60;

let currentTab = "daytrade";
let apiData = null;
let countdown = REFRESH_SECONDS;


/* =======================================
   データ取得
======================================= */

async function loadData() {

  const status = document.getElementById("status");
  const message = document.getElementById("message");

  try {

    status.innerHTML = "🟡 データ取得中...";
    status.className = "status-box";


    const response = await fetch(
      API_URL + "?t=" + Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );


    if (!response.ok) {
      throw new Error(
        "HTTPエラー " + response.status
      );
    }


    const data = await response.json();


    if (!data || data.status !== "ok") {

      throw new Error(
        data?.message ||
        "APIから正常なデータを取得できませんでした"
      );

    }


    apiData = data;


    status.innerHTML =
      "🟢 データ取得成功";

    status.className =
      "status-box success";


    document.getElementById("updated")
      .innerHTML =
      "更新時刻：" +
      (
        data.updated ||
        new Date().toLocaleString("ja-JP")
      );


    message.innerHTML =
      data.notice ||
      "ランキングデータを正常に取得しました。";


    renderRanking();


    countdown =
      REFRESH_SECONDS;


  } catch (error) {

    console.error(error);


    status.innerHTML =
      "🔴 データ取得失敗";

    status.className =
      "status-box error";


    message.innerHTML =
      "データ取得に失敗しました。<br>" +
      "しばらくしてから自動で再取得します。<br><br>" +
      error.message;

  }

}



/* =======================================
   タブ切替
======================================= */

function switchTab(tab) {

  currentTab = tab;


  const daytradeBtn =
    document.getElementById("daytradeBtn");

  const longtermBtn =
    document.getElementById("longtermBtn");

  const sectionTitle =
    document.getElementById("sectionTitle");


  if (tab === "daytrade") {

    daytradeBtn.classList.add("active");
    longtermBtn.classList.remove("active");

    sectionTitle.innerHTML =
      "⚡ デイトレ候補ランキング";

  } else {

    longtermBtn.classList.add("active");
    daytradeBtn.classList.remove("active");

    sectionTitle.innerHTML =
      "🚀 長期保有候補ランキング";

  }


  renderRanking();

}



/* =======================================
   ランキング表示
======================================= */

function renderRanking() {

  const container =
    document.getElementById("ranking");


  container.innerHTML = "";


  if (!apiData) {

    container.innerHTML =
      '<div class="empty">データ取得中...</div>';

    return;

  }


  let stocks = [];


  if (currentTab === "daytrade") {

    stocks =
      Array.isArray(apiData.daytrade)
        ? apiData.daytrade
        : [];

  } else {

    stocks =
      Array.isArray(apiData.longterm)
        ? apiData.longterm
        : [];

  }


  stocks =
    stocks
      .slice(0, 30)
      .map((stock, index) => {

        return {
          ...stock,
          rank:
            Number(stock.rank) ||
            index + 1
        };

      });


  if (stocks.length === 0) {

    container.innerHTML =
      '<div class="empty">ランキングデータがありません。</div>';

    return;

  }


  stocks.forEach(stock => {

    container.appendChild(
      createStockCard(stock)
    );

  });

}



/* =======================================
   銘柄カード生成
======================================= */

function createStockCard(stock) {

  const card =
    document.createElement("div");


  const score =
    normalizeNumber(stock.score);


  const signal =
    getSignal(score);


  card.className =
    "stock-card " +
    signal.cardClass;


  const rank =
    Number(stock.rank) || 0;


  const code =
    stock.code ||
    String(stock.symbol || "")
      .replace(".T", "");


  const symbol =
    stock.symbol ||
    code + ".T";


  const name =
    stock.name ||
    symbol;


  const price =
    normalizeNumber(stock.price);


  const change =
    normalizeNumber(stock.change);


  const momentum =
    normalizeNumber(stock.momentum);


  const volumeRatio =
    normalizeNumber(stock.volumeRatio);


  const yahooUrl =
    "https://finance.yahoo.co.jp/quote/" +
    encodeURIComponent(symbol);


  let changeClass =
    "neutral";

  if (change > 0) {
    changeClass =
      "positive";
  }

  if (change < 0) {
    changeClass =
      "negative";
  }


  let rankClass = "";

  if (rank === 1) {
    rankClass = "rank-1";
  }

  if (rank === 2) {
    rankClass = "rank-2";
  }

  if (rank === 3) {
    rankClass = "rank-3";
  }


  card.innerHTML = `

    <div class="stock-top">

      <div class="rank ${rankClass}">
        ${rank}
      </div>


      <div>

        <div class="stock-name">

          <a
            href="${yahooUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(name)}
          </a>

        </div>


        <div class="stock-code">
          ${escapeHtml(code)}
          / ${escapeHtml(symbol)}
        </div>

      </div>


      <div class="price-area">

        <div class="price">
          ${formatPrice(price)}
        </div>

        <div class="change ${changeClass}">
          ${formatSigned(change)}%
        </div>

      </div>

    </div>



    <div class="signal-row">

      <div class="signal ${signal.signalClass}">
        ${signal.label}
      </div>

      <div class="score">
        AIスコア
        ${score.toFixed(1)}
      </div>

    </div>



    <div class="score-bar-bg">

      <div
        class="score-bar"
        style="
          width:
          ${Math.max(
            0,
            Math.min(100, score)
          )}%
        "
      ></div>

    </div>



    <div class="metrics">

      <div class="metric">

        <div class="metric-label">
          当日騰落
        </div>

        <div
          class="metric-value
          ${changeClass}"
        >
          ${formatSigned(change)}%
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          モメンタム
        </div>

        <div class="metric-value">
          ${formatSigned(momentum)}%
        </div>

      </div>


      <div class="metric">

        <div class="metric-label">
          出来高倍率
        </div>

        <div class="metric-value">
          ${formatVolumeRatio(volumeRatio)}
        </div>

      </div>

    </div>



    <div class="reason">

      <strong>判定理由：</strong>

      ${
        escapeHtml(
          stock.reason ||
          "総合スコアから算出"
        )
      }

      <br>

      <a
        href="${yahooUrl}"
        target="_blank"
        rel="noopener noreferrer"
        class="open-chart"
      >
        📊 株価チャートを見る
      </a>

    </div>

  `;


  return card;

}



/* =======================================
   売買候補判定
======================================= */

function getSignal(score) {

  if (score >= 80) {

    return {
      label:
        "🔥 強い買い候補",

      cardClass:
        "strong-buy",

      signalClass:
        "signal-strong"
    };

  }


  if (score >= 65) {

    return {
      label:
        "🟢 買い候補",

      cardClass:
        "buy",

      signalClass:
        "signal-buy"
    };

  }


  if (score >= 50) {

    return {
      label:
        "🟡 様子見",

      cardClass:
        "wait",

      signalClass:
        "signal-wait"
    };

  }


  return {

    label:
      "🔴 注意",

    cardClass:
      "warning",

    signalClass:
      "signal-warning"

  };

}



/* =======================================
   数値処理
======================================= */

function normalizeNumber(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}



function formatPrice(value) {

  if (!value) {
    return "--";
  }


  return (
    "¥" +
    Math.round(value)
      .toLocaleString("ja-JP")
  );

}



function formatSigned(value) {

  const n =
    normalizeNumber(value);


  const sign =
    n > 0
      ? "+"
      : "";


  return (
    sign +
    n.toFixed(2)
  );

}



function formatVolumeRatio(value) {

  const n =
    normalizeNumber(value);


  if (n <= 0) {
    return "--";
  }


  return (
    n.toFixed(2) +
    "倍"
  );

}



/* =======================================
   HTMLエスケープ
======================================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}



/* =======================================
   自動更新カウントダウン
======================================= */

setInterval(() => {

  countdown--;


  if (countdown <= 0) {

    countdown =
      REFRESH_SECONDS;

    loadData();

  }


  document
    .getElementById("countdown")
    .innerHTML =
      "次回更新：" +
      countdown +
      "秒";

}, 1000);



/* =======================================
   初回読み込み
======================================= */

loadData();

</script>

</body>
</html>
