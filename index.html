<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #263247;
      padding: 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .sub {
      margin-top: 6px;
      color: #aeb9cc;
      font-size: 13px;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: #7ee787;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-button {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 13px 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #1a2333;
      color: #b7c2d4;
    }

    .tab-button.active {
      background: #2f81f7;
      color: white;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .ranking-list {
      display: grid;
      gap: 12px;
    }

    .card {
      background: linear-gradient(145deg, #131c2c, #101827);
      border: 1px solid #27344b;
      border-radius: 14px;
      padding: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank {
      min-width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #263247;
      font-size: 18px;
      font-weight: 800;
    }

    .rank.gold {
      background: #d4a017;
      color: #111;
    }

    .rank.silver {
      background: #b8c0cc;
      color: #111;
    }

    .rank.bronze {
      background: #b87333;
      color: #111;
    }

    .stock-main {
      flex: 1;
      min-width: 0;
    }

    .stock-name {
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .stock-code {
      color: #91a0b7;
      margin-top: 3px;
      font-size: 13px;
    }

    .score {
      font-weight: 800;
      font-size: 18px;
      color: #58a6ff;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      background: #0d1523;
      border-radius: 9px;
      padding: 9px;
    }

    .metric-label {
      font-size: 11px;
      color: #8290a8;
    }

    .metric-value {
      margin-top: 3px;
      font-size: 14px;
      font-weight: bold;
    }

    .positive {
      color: #ff6b6b;
    }

    .negative {
      color: #4da3ff;
    }

    .reason {
      margin-top: 12px;
      padding: 10px;
      background: #0e1726;
      border-left: 4px solid #2f81f7;
      border-radius: 6px;
      line-height: 1.6;
      color: #d8e0ec;
      font-size: 14px;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 20px;
      color: #b3bed0;
    }

    .error {
      color: #ff7b72;
    }

    .update-time {
      margin-bottom: 12px;
      color: #9faabd;
      font-size: 12px;
    }

    .notice {
      background: #251f10;
      color: #f0c36d;
      border: 1px solid #5b4618;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    @media (min-width: 700px) {
      .ranking-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .metrics {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>📈 日本株 AIランキング</h1>

    <div class="sub">
      デイトレ候補・長期保有候補を自動ランキング
    </div>

    <div class="status" id="status">
      データ取得中...
    </div>
  </div>
</header>

<main>

  <div class="notice">
    ※ このランキングは参考情報です。利益を保証するものではありません。
    投資判断はご自身の責任で行ってください。
  </div>

  <div class="tabs">
    <button
      class="tab-button active"
      onclick="showTab('daytrade', this)"
    >
      ⚡ デイトレ TOP30
    </button>

    <button
      class="tab-button"
      onclick="showTab('longterm', this)"
    >
      🚀 長期成長 TOP30
    </button>
  </div>

  <section id="daytrade" class="panel active">
    <div class="update-time" id="daytradeUpdate"></div>
    <div id="daytradeList" class="ranking-list">
      <div class="loading">ランキング取得中...</div>
    </div>
  </section>

  <section id="longterm" class="panel">
    <div class="update-time" id="longtermUpdate"></div>
    <div id="longtermList" class="ranking-list">
      <div class="loading">ランキング取得中...</div>
    </div>
  </section>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwO7wWUeLTTy6QXq1lR5odHNSpUGpEwgvxG4eFq9baS9P5vUOo5FN6Tfvx1sUQZVHizNg/exec";

let loading = false;

function showTab(tabId, button) {

  document
    .querySelectorAll(".panel")
    .forEach(panel => {
      panel.classList.remove("active");
    });

  document
    .querySelectorAll(".tab-button")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  document
    .getElementById(tabId)
    .classList.add("active");

  button.classList.add("active");
}


function safeNumber(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return 0;
  }

  return n;
}


function formatPrice(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  return n.toLocaleString("ja-JP");
}


function formatPercent(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  const sign = n > 0 ? "+" : "";

  return sign + n.toFixed(2) + "%";
}


function rankClass(rank) {

  if (rank === 1) return "gold";

  if (rank === 2) return "silver";

  if (rank === 3) return "bronze";

  return "";
}


function escapeHtml(text) {

  return String(text ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function createDaytradeCard(stock) {

  const rank = safeNumber(stock.rank);

  const change = safeNumber(stock.change);

  const changeClass =
    change >= 0 ? "positive" : "negative";

  return `

    <article class="card">

      <div class="top-row">

        <div class="rank ${rankClass(rank)}">
          ${rank}
        </div>

        <div class="stock-main">

          <div class="stock-name">
            ${escapeHtml(stock.name)}
          </div>

          <div class="stock-code">
            ${escapeHtml(stock.code)}
          </div>

        </div>

        <div class="score">
          ${safeNumber(stock.score).toFixed(1)}
        </div>

      </div>


      <div class="metrics">

        <div class="metric">
          <div class="metric-label">
            株価
          </div>

          <div class="metric-value">
            ¥${formatPrice(stock.price)}
          </div>
        </div>


        <div class="metric">
          <div class="metric-label">
            騰落率
          </div>

          <div class="metric-value ${changeClass}">
            ${formatPercent(change)}
          </div>
        </div>


        <div class="metric">
          <div class="metric-label">
            モメンタム
          </div>

          <div class="metric-value">
            ${safeNumber(stock.momentum).toFixed(2)}
          </div>
        </div>


        <div class="metric">
          <div class="metric-label">
            出来高倍率
          </div>

          <div class="metric-value">
            ${safeNumber(stock.volumeRatio).toFixed(2)}
          </div>
        </div>

      </div>


      <div class="reason">
        <strong>選出理由</strong><br>
        ${escapeHtml(stock.reason)}
      </div>

    </article>

  `;
}


function createLongtermCard(stock) {

  const rank = safeNumber(stock.rank);

  return `

    <article class="card">

      <div class="top-row">

        <div class="rank ${rankClass(rank)}">
          ${rank}
        </div>

        <div class="stock-main">

          <div class="stock-name">
            ${escapeHtml(stock.name)}
          </div>

          <div class="stock-code">
            ${escapeHtml(stock.code)}
          </div>

        </div>

        <div class="score">
          ${safeNumber(stock.score).toFixed(1)}
        </div>

      </div>


      <div class="metrics">

        <div class="metric">

          <div class="metric-label">
            株価
          </div>

          <div class="metric-value">
            ¥${formatPrice(stock.price)}
          </div>

        </div>


        <div class="metric">

          <div class="metric-label">
            6か月
          </div>

          <div class="metric-value positive">
            ${formatPercent(stock.sixMonth)}
          </div>

        </div>


        <div class="metric">

          <div class="metric-label">
            1か月
          </div>

          <div class="metric-value">
            ${formatPercent(stock.oneMonth)}
          </div>

        </div>


        <div class="metric">

          <div class="metric-label">
            20日平均
          </div>

          <div class="metric-value">
            ¥${formatPrice(stock.ma20)}
          </div>

        </div>

      </div>


      <div class="reason">

        <strong>選出理由</strong><br>

        ${escapeHtml(stock.reason)}

      </div>

    </article>

  `;
}


function renderRankings(data) {

  const daytrade =
    Array.isArray(data.daytrade)
      ? data.daytrade.slice(0, 30)
      : [];

  const longterm =
    Array.isArray(data.longterm)
      ? data.longterm.slice(0, 30)
      : [];


  document.getElementById("daytradeList").innerHTML =

    daytrade.length
      ? daytrade.map(createDaytradeCard).join("")
      : '<div class="error">デイトレデータがありません。</div>';


  document.getElementById("longtermList").innerHTML =

    longterm.length
      ? longterm.map(createLongtermCard).join("")
      : '<div class="error">長期データがありません。</div>';


  const updated =
    data.updated || new Date().toLocaleString("ja-JP");


  document.getElementById("daytradeUpdate").textContent =
    "最終更新：" + updated;


  document.getElementById("longtermUpdate").textContent =
    "最終更新：" + updated;


  document.getElementById("status").textContent =
    "● 自動更新中 ｜ 1分ごと";


  if (data.notice) {

    console.log(data.notice);

  }
}


async function loadData() {

  if (loading) return;

  loading = true;

  const status =
    document.getElementById("status");


  try {

    status.textContent =
      "データ更新中...";


    const separator =
      API_URL.includes("?") ? "&" : "?";


    const response =
      await fetch(
        API_URL +
        separator +
        "_=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (
      data.status &&
      data.status !== "ok"
    ) {

      throw new Error(
        data.message ||
        "APIエラー"
      );

    }


    renderRankings(data);

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "⚠ データ取得エラー";


    const daytradeList =
      document.getElementById("daytradeList");


    if (
      !daytradeList.querySelector(".card")
    ) {

      daytradeList.innerHTML =
        '<div class="error">データを取得できませんでした。<br>少し待って再読み込みしてください。</div>';

    }

  }

  finally {

    loading = false;

  }
}


loadData();


// 60秒ごとにランキング更新
setInterval(
  loadData,
  60 * 1000
);


// 画面に戻ってきた時にも更新
document.addEventListener(
  "visibilitychange",
  () => {

    if (!document.hidden) {

      loadData();

    }

  }
);

</script>

</body>
</html>
