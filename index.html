<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>デイトレード収支管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      color: #94a3b8;
      font-size: 13px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    .card span {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .card strong {
      font-size: 22px;
    }

    .profit {
      color: #22c55e;
    }

    .loss {
      color: #ef4444;
    }

    .form-box {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .form-box h2 {
      margin-top: 0;
      font-size: 19px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      color: #cbd5e1;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 70px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      background: #1d4ed8;
    }

    .delete-btn {
      background: #dc2626;
      margin-top: 8px;
      padding: 9px;
      font-size: 14px;
    }

    .history {
      background: #1e293b;
      padding: 15px;
      border-radius: 12px;
    }

    .history h2 {
      margin-top: 0;
      font-size: 19px;
    }

    .trade {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }

    .trade-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .trade-symbol {
      font-weight: bold;
      font-size: 17px;
    }

    .trade-date {
      color: #94a3b8;
      font-size: 13px;
    }

    .trade-result {
      font-size: 19px;
      font-weight: bold;
      margin-top: 6px;
    }

    .memo {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 14px;
      word-break: break-word;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      padding: 20px 5px;
    }

    .reset-btn {
      background: #475569;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 25px 10px;
      font-size: 12px;
    }
