<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本株 AIランキング</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    header {
      padding: 22px 15px;
      text-align: center;
      background: linear-gradient(135deg, #0d1b2a, #123c69);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 1px;
    }

    header p {
      margin: 8px 0 0;
      color: #b9d4ef;
      font-size: 13px;
    }

    .status-area {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 12px;
      background: rgba(255,255,255,0.1);
    }

    .status.ok {
      color: #75ffb3;
    }

    .status.error {
      color: #ff8c8c;
    }

    .container {
      width: min(1500px, 100%);
      margin: auto;
      padding: 18px 10px 40px;
    }

    .notice {
      background: #17263a;
      border: 1px solid #2a405b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
      color: #b9cce2;
      font-size: 13px;
      line-height: 1.6;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      position: sticky;
      top: 105px;
      z-index: 90;
      padding: 5px 0;
      background: #07111f;
    }

    .tab {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 14px 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      color: #c8dbef;
      background: #142338;
    }

    .tab.active {
      color: white;
      background: linear-gradient(135deg, #087fef, #00a5ff);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-title {
      margin: 10px 0 15px;
      font-size: 21px;
    }

    .ranking {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 13px;
    }

    .card {
      background: linear-gradient(145deg, #101d2e, #0d1726);
      border: 1px solid #203550;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.22);
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.top1 {
      border-color: #ffd700;
      box-shadow: 0 0 22px rgba(255,215,0,0.12);
    }

    .card.top2 {
      border-color: #c0c0c0;
    }

    .card.top3 {
      border-color: #cd7f32;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .rank {
      font-size: 26px;
      font-weight: 900;
      min-width: 55px;
    }

    .rank1 {
      color: #ffd700;
    }

    .rank2 {
      color: #d9e2ec;
    }

    .rank3 {
      color: #e5a15e;
    }

    .rankNormal {
      color: #56b7ff;
    }

    .company {
      flex: 1;
    }

    .company-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .code {
      font-size: 12px;
      color: #7f9ab7;
    }

    .score-box {
      text-align: right;
      background: #17283d;
      padding: 8px 10px;
      border-radius: 10px;
      min-width: 72px;
    }

    .score-label {
      font-size: 10px;
      color: #7e9bb9;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
      color: #4fc3ff;
    }

    .price {
      margin-top: 16px;
      font-size: 26px;
      font-weight: bold;
    }

    .price span {
      color: #9cb2c9;
      font-size: 13px;
      font-weight: normal;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .metric {
      background: #132337;
      border-radius: 9px;
      padding: 9px;
    }

    .metric-name {
      color: #7f9bb9;
      font-size: 11px;
    }

    .metric-value {
      margin-top: 3px;
      font-size: 15px;
      font-weight: bold;
    }

    .positive {
      color: #61e999;
    }

    .negative {
      color: #ff7373;
    }

    .neutral {
      color: #c5d5e5;
    }

    .reason {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid #203550;
      color: #c1d1e1;
      font-size: 13px;
      line-height: 1.65;
    }

    .reason-title {
      color: #65c6ff;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .loading {
      padding: 60px 20px;
      text-align: center;
      color: #9db7cf;
      font-size: 16px;
    }

    .update-button {
      border: none;
      background: #1584e8;
      color: white;
      border-radius: 8px;
      padding: 7px 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .update-button:disabled {
      opacity: .5;
      cursor: wait;
    }

    footer {
      text-align: center;
      color: #647e98;
      font-size: 11px;
      padding: 20px 10px 40px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .container {
        padding-left: 8px;
        padding-right: 8px;
      }

      .ranking {
        grid-template-columns: 1fr;
      }

      .tabs {
        top: 115px;
      }

      .card {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📈 日本株 AIランキング</h1>
  <p>デイトレ候補 ＆ 長期成長株候補</p>

  <div class="status-area">
    <span id="status" class="status">データ取得中...</span>
    <span id="updated" class="status">更新時刻 --</span>

    <button
      id="reloadButton"
      class="update-button"
      onclick="loadData()">
      今すぐ更新
    </button>
  </div>
</header>

<div class="container">

  <div id="notice" class="notice">
    ランキングは参考情報です。投資判断はご自身の責任で行ってください。
  </div>

  <div class="tabs">
    <button
      class="tab active"
      onclick="showTab('daytrade', this)">
      ⚡ デイトレ TOP30
    </button>

    <button
      class="tab"
      onclick="showTab('longterm', this)">
      🚀 長期保有 TOP30
    </button>
  </div>

  <section id="daytrade" class="section active">
    <h2 class="section-title">⚡ デイトレ候補ランキング</h2>

    <div id="daytradeRanking" class="ranking">
      <div class="loading">
        デイトレランキングを読み込んでいます...
      </div>
    </div>
  </section>

  <section id="longterm" class="section">
    <h2 class="section-title">🚀 長期成長株ランキング</h2>

    <div id="longtermRanking" class="ranking">
      <div class="loading">
        長期ランキングを読み込んでいます...
      </div>
    </div>
  </section>

</div>

<footer>
  本ページは株価データを基にした参考ランキングです。<br>
  将来の値上がり・利益を保証するものではありません。
</footer>

<script>

  // ==============================
  // Apps Script API
  // ==============================

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwO7wWUeLTTy6QXq1lR5odHNSpUGpEwgvxG4eFq9baS9P5vUOo5FN6Tfvx1sUQZVHizNg/exec";


  // 1分 = 60,000ミリ秒
  const UPDATE_INTERVAL = 60000;


  function showTab(id, button) {

    document
      .querySelectorAll(".section")
      .forEach(section => {
        section.classList.remove("active");
      });

    document
      .querySelectorAll(".tab")
      .forEach(tab => {
        tab.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

    button.classList.add("active");
  }


  function numberFormat(value) {

    const num = Number(value);

    if (!Number.isFinite(num)) {
      return "-";
    }

    return new Intl.NumberFormat("ja-JP", {
      maximumFractionDigits: 2
    }).format(num);
  }


  function percentClass(value) {

    const num = Number(value);

    if (num > 0) {
      return "positive";
    }

    if (num < 0) {
      return "negative";
    }

    return "neutral";
  }


  function signedPercent(value) {

    const num = Number(value);

    if (!Number.isFinite(num)) {
      return "-";
    }

    const plus = num > 0 ? "+" : "";

    return plus + numberFormat(num) + "%";
  }


  function rankClass(rank) {

    if (rank === 1) {
      return "rank1";
    }

    if (rank === 2) {
      return "rank2";
    }

    if (rank === 3) {
      return "rank3";
    }

    return "rankNormal";
  }


  function cardClass(rank) {

    if (rank === 1) {
      return "top1";
    }

    if (rank === 2) {
      return "top2";
    }

    if (rank === 3) {
      return "top3";
    }

    return "";
  }


  function rankIcon(rank) {

    if (rank === 1) {
      return "🥇";
    }

    if (rank === 2) {
      return "🥈";
    }

    if (rank === 3) {
      return "🥉";
    }

    return rank + "位";
  }


  function createDaytradeCard(stock) {

    return `
      <article class="card ${cardClass(stock.rank)}">

        <div class="card-head">

          <div class="rank ${rankClass(stock.rank)}">
            ${rankIcon(stock.rank)}
          </div>

          <div class="company">
            <div class="company-name">
              ${escapeHtml(stock.name)}
            </div>

            <div class="code">
              ${escapeHtml(stock.code)} /
              ${escapeHtml(stock.symbol)}
            </div>
          </div>

          <div class="score-box">
            <div class="score-label">
              AI SCORE
            </div>

            <div class="score">
              ${numberFormat(stock.score)}
            </div>
          </div>

        </div>


        <div class="price">
          ¥${numberFormat(stock.price)}
          <span>現在値</span>
        </div>


        <div class="metrics">

          <div class="metric">
            <div class="metric-name">
              当日騰落率
            </div>

            <div class="metric-value ${percentClass(stock.change)}">
              ${signedPercent(stock.change)}
            </div>
          </div>


          <div class="metric">
            <div class="metric-name">
              短期モメンタム
            </div>

            <div class="metric-value ${percentClass(stock.momentum)}">
              ${signedPercent(stock.momentum)}
            </div>
          </div>


          <div class="metric">
            <div class="metric-name">
              出来高倍率
            </div>

            <div class="metric-value">
              ${numberFormat(stock.volumeRatio)}倍
            </div>
          </div>


          <div class="metric">
            <div class="metric-name">
              AIスコア
            </div>

            <div class="metric-value">
              ${numberFormat(stock.score)}
            </div>
          </div>

        </div>


        <div class="reason">

          <div class="reason-title">
            AI選定理由
          </div>

          ${escapeHtml(stock.reason)}

        </div>

      </article>
    `;
  }


  function createLongtermCard(stock) {

    return `
      <article class="card ${cardClass(stock.rank)}">

        <div class="card-head">

          <div class="rank ${rankClass(stock.rank)}">
            ${rankIcon(stock.rank)}
          </div>

          <div class="company">

            <div class="company-name">
              ${escapeHtml(stock.name)}
            </div>

            <div class="code">
              ${escapeHtml(stock.code)} /
              ${escapeHtml(stock.symbol)}
            </div>

          </div>


          <div class="score-box">

            <div class="score-label">
              AI SCORE
            </div>

            <div class="score">
              ${numberFormat(stock.score)}
            </div>

          </div>

        </div>


        <div class="price">
          ¥${numberFormat(stock.price)}
          <span>現在値</span>
        </div>


        <div class="metrics">

          <div class="metric">

            <div class="metric-name">
              6か月
            </div>

            <div class="metric-value ${percentClass(stock.sixMonth)}">
              ${signedPercent(stock.sixMonth)}
            </div>

          </div>


          <div class="metric">

            <div class="metric-name">
              1か月
            </div>

            <div class="metric-value ${percentClass(stock.oneMonth)}">
              ${signedPercent(stock.oneMonth)}
            </div>

          </div>


          <div class="metric">

            <div class="metric-name">
              20日移動平均
            </div>

            <div class="metric-value">
              ¥${numberFormat(stock.ma20)}
            </div>

          </div>


          <div class="metric">

            <div class="metric-name">
              60日移動平均
            </div>

            <div class="metric-value">
              ¥${numberFormat(stock.ma60)}
            </div>

          </div>

        </div>


        <div class="reason">

          <div class="reason-title">
            AI選定理由
          </div>

          ${escapeHtml(stock.reason)}

        </div>

      </article>
    `;
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  async function loadData() {

    const status =
      document.getElementById("status");

    const updated =
      document.getElementById("updated");

    const button =
      document.getElementById("reloadButton");

    button.disabled = true;

    status.textContent =
      "🔄 データ更新中...";

    status.className =
      "status";

    try {

      // キャッシュ対策
      const url =
        API_URL +
        "?t=" +
        new Date().getTime();


      const response =
        await fetch(url, {
          method: "GET",
          cache: "no-store"
        });


      if (!response.ok) {

        throw new Error(
          "HTTPエラー " +
          response.status
        );

      }


      const data =
        await response.json();


      if (data.status !== "ok") {

        throw new Error(
          data.message ||
          "APIからエラーが返されました"
        );

      }


      const daytrade =
        Array.isArray(data.daytrade)
          ? data.daytrade
          : [];


      const longterm =
        Array.isArray(data.longterm)
          ? data.longterm
          : [];


      document
        .getElementById("daytradeRanking")
        .innerHTML =
        daytrade.length
          ? daytrade
              .map(createDaytradeCard)
              .join("")
          : `
            <div class="loading">
              デイトレデータがありません
            </div>
          `;


      document
        .getElementById("longtermRanking")
        .innerHTML =
        longterm.length
          ? longterm
              .map(createLongtermCard)
              .join("")
          : `
            <div class="loading">
              長期データがありません
            </div>
          `;


      if (data.notice) {

        document
          .getElementById("notice")
          .textContent =
          data.notice;

      }


      status.textContent =
        "🟢 API接続OK";


      status.className =
        "status ok";


      updated.textContent =
        "データ更新 " +
        (
          data.updated ||
          new Date().toLocaleString("ja-JP")
        );


    } catch (error) {

      console.error(error);


      status.textContent =
        "🔴 データ取得エラー";


      status.className =
        "status error";


      updated.textContent =
        error.message;


      document
        .getElementById("daytradeRanking")
        .innerHTML = `
          <div class="loading">
            データを取得できませんでした。<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;


      document
        .getElementById("longtermRanking")
        .innerHTML = `
          <div class="loading">
            データを取得できませんでした。
          </div>
        `;

    } finally {

      button.disabled = false;

    }

  }


  // 最初に取得
  loadData();


  // ==============================
  // 1分ごとに自動更新
  // ==============================

  setInterval(
    loadData,
    UPDATE_INTERVAL
  );

</script>

</body>
</html>
