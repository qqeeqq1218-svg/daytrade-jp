<html lang="ja">
<head>

      margin: auto;
      padding: 15px;
    }

    .summary {
      display: grid;

    }

    }

    .card strong {
      font-size: 22px;
    }

    .profit {
      color: #22c55e;
    }

    .loss {
      color: #ef4444;
    }
